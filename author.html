  bio: 'সুকান্ত ভট্টাচার্য (১৫ আগস্ট ১৯২৬ – ১৩ মে ১৯৪৭) ছিলেন বাংলা সাহিত্যের এক ক্ষণজন্মা, প্রগতিশীল ও বিপ্লবী তরুণ কবি। সমাজতান্ত্রিক চেতনায় উদ্বুদ্ধ এই কবি তাঁর প্রতিবাদী ও মানবমুক্তির কবিতার জন্য বাংলা সাহিত্যে "কিশোর কবি" বা "কিশোর বিদ্রোহী কবি" নামে সমধিক পরিচিত। মাত্র ২০ বছর বয়সে যক্ষ্মা রোগে আক্রান্ত হয়ে তাঁর জীবনাবসান হলেও বাংলা কবিতায় তিনি অমর হয়ে আছেন।<br><br><b>জন্ম ও পরিচয়:</b><br>• জন্ম: ১৫ আগস্ট ১৯২৬, কলকাতার কালীঘাটে মাতুলালয়ে।<br>• আদি নিবাস: গোপালগঞ্জ জেলার কোটালীপাড়া উপজেলার ঊনশিয়া গ্রাম (বর্তমান বাংলাদেশ)।<br>• পিতা: নিবারণচন্দ্র ভট্টাচার্য।<br>• মাতা: সুনীতি দেবী।<br>• মৃত্যু: ১৩ মে ১৯৪৭, কলকাতার যাদবপুর যক্ষ্মা হাসপাতালে চিকিৎসাধীন অবস্থায় মাত্র ২০ বছর বয়সে মৃত্যুবরণ করেন।<br><br><b>রাজনৈতিক ও সাহিত্যিক কর্মকাণ্ড:</b><br>• ভারতের কমিউনিস্ট পার্টির সক্রিয় সদস্য ছিলেন এবং প্রগতিশীল ছাত্র আন্দোলনের সঙ্গে যুক্ত ছিলেন।<br>• কমিউনিস্ট পার্টির পত্রিকা <b>দৈনিক স্বাধীনতা</b>-এর ‘কিশোর সভা’ বিভাগ সম্পাদনা করতেন।<br>• দ্বিতীয় বিশ্বযুদ্ধ, ১৯৪৩ সালের মন্বন্তর, ফ্যাসিবাদ এবং সাম্প্রদায়িক দাঙ্গার বিরুদ্ধে তাঁর কবিতা ছিল প্রতিবাদের শক্তিশালী ভাষা।<br><br><b>উল্লেখযোগ্য কাব্যগ্রন্থ:</b><br>• ছাড়পত্র (১৯৪৭)<br>• পূর্বাভাস (১৯৫০)<br>• মিঠেকড়া (১৯৫১)<br>• অভিযান (১৯৫৩)<br>• ঘুম নেই (১৯৫৪)<br>• হরতাল (১৯৬২)<br><br><b>জনপ্রিয় রচনা:</b><br>‘আঠারো বছর বয়স’, ‘হে মহাজীবন’, ‘রানার’, ‘ছাড়পত্র’সহ অসংখ্য কালজয়ী কবিতা বাংলা সাহিত্যের অমূল্য সম্পদ। তাঁর বিখ্যাত পঙক্তি— <i>“ক্ষুধার রাজ্যে পৃথিবী গদ্যময়, পূর্ণিমা-চাঁদ যেন ঝলসানো রুটি।”</i> — বাংলা কবিতার ইতিহাসে চিরস্মরণীয় হয়ে আছে।'
},
  'কাজী নজরুল ইসলাম': {
  img: 'https://i.ibb.co/s9kvLv0T/image.jpg',
  bio: 'বাংলাদেশের জাতীয় কবি কাজী নজরুল ইসলাম (২৪ মে ১৮৯৯ – ২৯ আগস্ট ১৯৭৬) ছিলেন বিংশ শতাব্দীর অন্যতম শ্রেষ্ঠ বাঙালি কবি, ঔপন্যাসিক, নাট্যকার, সঙ্গীতজ্ঞ ও সাংবাদিক। শোষণ, অন্যায় ও সাম্প্রদায়িকতার বিরুদ্ধে তাঁর সাহসী কণ্ঠস্বরের জন্য তিনি "বিদ্রোহী কবি" নামে সমধিক পরিচিত। তিনি প্রায় ৪,০০০ গান রচনা ও সুর করেছেন, যা "নজরুলগীতি" নামে পরিচিত।<br><br><b>সংক্ষিপ্ত পরিচয়:</b><br>• জন্ম: ২৪ মে ১৮৯৯, চুরুলিয়া, আসানসোল, বর্ধমান, পশ্চিমবঙ্গ।<br>• ডাকনাম: দুখু মিয়া।<br>• প্রথম বিশ্বযুদ্ধের সময় ব্রিটিশ ভারতীয় সেনাবাহিনীতে যোগদান করেন।<br>• ১৯৪২ সালে পিকস রোগে আক্রান্ত হয়ে বাকশক্তি ও স্মৃতিশক্তি হারান।<br>• ১৯৭২ সালে স্বাধীন বাংলাদেশে আসেন।<br>• ২৯ আগস্ট ১৯৭৬ সালে ঢাকায় মৃত্যুবরণ করেন এবং ঢাকা বিশ্ববিদ্যালয় কেন্দ্রীয় মসজিদের পাশে সমাহিত হন।<br><br><b>সাহিত্যকর্ম:</b><br>বাংলা সাহিত্যে বিদ্রোহ, সাম্য, মানবতা ও প্রেমের এক অনন্য কণ্ঠস্বর ছিলেন নজরুল।<br><br><b>উল্লেখযোগ্য কাব্যগ্রন্থ:</b><br>১. অগ্নিবীণা<br>২. বিষের বাঁশি<br>৩. সাম্যবাদী<br>৪. দোলনচাঁপা<br>৫. সর্বহারা<br><br><b>উল্লেখযোগ্য উপন্যাস:</b><br>১. বাঁধনহারা<br>২. মৃত্যুক্ষুধা<br>৩. কুহেলিকা<br><br><b>সঙ্গীতকর্ম:</b><br>তিনি বাংলা গজলের প্রবর্তক। ইসলামি সঙ্গীত, হামদ-নাত, শ্যামাসঙ্গীত, ভক্তিগীতি ও দেশাত্মবোধক গান রচনার মাধ্যমে বাংলা সংগীতকে সমৃদ্ধ করেছেন।<br><br><b>অবদান:</b><br>কাজী নজরুল ইসলাম বাংলা সাহিত্য ও সংস্কৃতিতে বিদ্রোহ, সাম্য, মানবতা এবং অসাম্প্রদায়িক চেতনার চিরন্তন প্রতীক।'
},
  'কায়কোবাদ': {
  img: 'https://i.postimg.cc/prNXrVBf/kaykobad.webp',
  bio: 'মহাকবি কায়কোবাদ হলেন আধুনিক বাংলা সাহিত্যের প্রথম মুসলিম মহাকবি এবং বাংলা মহাকাব্য ধারার শেষ কবি। তাঁর প্রকৃত নাম কাজেম আল কোরায়শী। ১৯০৪ সালে প্রকাশিত তাঁর বিখ্যাত মহাকাব্য \'মহাশ্মশান\'-এর জন্য তিনি বাংলা সাহিত্যে অমর হয়ে আছেন এবং ‘মহাকবি’ উপাধি লাভ করেন।<br><br><b>ব্যক্তিগত জীবন ও কর্মজীবন:</b><br>• জন্ম: ২৫ ফেব্রুয়ারি ১৮৫৭ সালে ঢাকার নবাবগঞ্জ উপজেলার আগলা পূর্বপাড়া গ্রামে।<br>• পেশা: দীর্ঘকাল নিজের গ্রামের আগলা ডাকঘরে পোস্টমাস্টার হিসেবে চাকরি করেন।<br>• মৃত্যু: ২১ জুলাই ১৯৫১ সালে ঢাকায় ৯৪ বছর বয়সে।<br><br><b>বিখ্যাত সাহিত্যকর্মসমূহ:</b><br>• মহাশ্মশান (১৯০৪): পানিপথের তৃতীয় যুদ্ধের পটভূমিতে রচিত শ্রেষ্ঠ মহাকাব্য।<br>• বিরহ বিলাপ (১৮৭০): মাত্র ১৩ বছর বয়সে প্রকাশিত প্রথম কাব্যগ্রন্থ।<br>• অন্যান্য: কুসুম কানন, অশ্রুমালা, শিব-মন্দির, অমিয়ধারা, শ্মশান-ভস্ম ইত্যাদি।'
},
  'রবীন্দ্রনাথ ঠাকুর': {
  img: 'https://i.ibb.co/SwjPSQk2/image.jpg',
  bio: 'বিশ্বকবি রবীন্দ্রনাথ ঠাকুর (৭ মে ১৮৬১ – ৭ আগস্ট ১৯৪১) ছিলেন বাংলা সাহিত্যের সর্বশ্রেষ্ঠ ব্যক্তিত্বদের অন্যতম। তিনি একাধারে কবি, ঔপন্যাসিক, নাট্যকার, ছোটগল্পকার, প্রাবন্ধিক, সংগীতস্রষ্টা, চিত্রকর ও শিক্ষাবিদ। ১৯১৩ সালে "গীতাঞ্জলি" কাব্যগ্রন্থের জন্য সাহিত্যে নোবেল পুরস্কার অর্জন করে এশিয়ার প্রথম নোবেলজয়ী সাহিত্যিক হন।<br><br><b>সংক্ষিপ্ত পরিচয়:</b><br>• জন্ম: ৭ মে ১৮৬১, জোড়াসাঁকো ঠাকুরবাড়ি, কলকাতা।<br>• পিতা: মহর্ষি দেবেন্দ্রনাথ ঠাকুর।<br>• মাতা: সারদাসুন্দরী দেবী।<br>• মূলত গৃহশিক্ষকদের কাছেই শিক্ষা লাভ করেন। পরবর্তীতে ইংল্যান্ডে গেলেও পড়াশোনা সম্পূর্ণ না করে দেশে ফিরে আসেন।<br><br><b>সাহিত্যকর্ম:</b><br>কবিতা, উপন্যাস, নাটক, ছোটগল্প, প্রবন্ধ ও সংগীত—বাংলা সাহিত্যের প্রতিটি শাখায় তাঁর অবদান অনন্য।<br><br><b>উল্লেখযোগ্য কাব্যগ্রন্থ:</b><br>১. গীতাঞ্জলি<br>২. সোনার তরী<br>৩. মানসী<br>৪. বলাকা<br>৫. চিত্রা<br><br><b>উল্লেখযোগ্য উপন্যাস:</b><br>১. গোরা<br>২. ঘরে বাইরে<br>৩. চোখের বালি<br>৪. যোগাযোগ<br><br><b>উল্লেখযোগ্য নাটক:</b><br>১. ডাকঘর<br>২. রক্তকরবী<br>৩. রাজা<br>৪. মুক্তধারা<br><br><b>সংগীতকর্ম:</b><br>তিনি প্রায় ২,২০০-এর বেশি গান রচনা করেন, যা "রবীন্দ্রসংগীত" নামে পরিচিত। তাঁর রচিত "আমার সোনার বাংলা" বাংলাদেশের জাতীয় সংগীত এবং "জন গণ মন" ভারতের জাতীয় সংগীত।<br><br><b>প্রাতিষ্ঠানিক অবদান:</b><br>শান্তিনিকেতনে প্রতিষ্ঠিত তাঁর শিক্ষাপ্রতিষ্ঠান পরবর্তীতে বিশ্বভারতী বিশ্ববিদ্যালয়ে রূপ লাভ করে। ১৯১৯ সালের জালিয়ানওয়ালাবাগ হত্যাকাণ্ডের প্রতিবাদে তিনি ব্রিটিশ সরকারের প্রদত্ত নাইটহুড উপাধি বর্জন করেন।<br><br><b>উত্তরাধিকার:</b><br>রবীন্দ্রনাথ ঠাকুরের সাহিত্য, সংগীত, শিক্ষা ও মানবতাবাদী দর্শন আজও বাংলা সংস্কৃতি ও বিশ্বসাহিত্যের অন্যতম শ্রেষ্ঠ সম্পদ হিসেবে বিবেচিত।'
},
  'লিও তলস্তয়': {
  img: 'https://i.postimg.cc/KYtFrLhK/count-leo-tolstoy.webp',
  bio: 'লিও তলস্তয় (রুশ লিয়েফ়্ নিকলায়েভ়িচ্ তল্‌স্তোয়; ২৮ আগস্ট ১৮২৮ – ২০ নভেম্বর ১৯১০) ছিলেন রুশ সাহিত্যের অন্যতম শ্রেষ্ঠ লেখক, এমনকি বিশ্ব সাহিত্যের অন্যতম শ্রেষ্ঠ ঔপন্যাসিক হিসেবেও বিবেচিত।<br><br><b>সংক্ষিপ্ত পরিচয়:</b><br>• জন্ম: ২৮ আগস্ট ১৮২৮, ইয়াস্নায়া পলিয়ানা, তুলা প্রদেশ, রুশ সাম্রাজ্য।<br>• পরিবারের চতুর্থ সন্তান, শিশু বয়সে পিতা-মাতাকে হারান এবং আত্মীয়দের কাছে বড় হন।<br>• ছিলেন স্বশিক্ষিত - লাতিন, ইংরেজি, আরবি, তুর্কো-তাতার, ইতালীয়, গ্রীক ও হিব্রু ভাষায় পারদর্শী ছিলেন। সংগীত ও চিত্রাঙ্কনেও দক্ষ ছিলেন।<br>• ভালুক শিকারি হিসেবে খ্যাত ছিলেন এবং অত্যন্ত একগুঁয়ে ও স্বাধীনচেতা স্বভাবের ছিলেন।<br><br><b>সাহিত্যকর্ম:</b><br>উপন্যাস, নাটক, ছোটগল্প, বড়গল্প, প্রবন্ধ, শিশুসাহিত্য, ডায়েরি ও চিঠিপত্র মিলিয়ে তার রচনা সমগ্র প্রায় ৯০ খণ্ডে সোভিয়েত ইউনিয়নে প্রকাশিত হয়।<br><br><b>উল্লেখযোগ্য উপন্যাস:</b><br>১. যুদ্ধ ও শান্তি (১৮৬৩-১৮৬৯)<br>২. আন্না কারেনিনা (১৮৭৩-১৮৭৭)<br>৩. পুনরুত্থান (১৮৯৯)<br><br><b>উল্লেখযোগ্য বড় গল্প:</b><br>১. ইভান ইলিচের মৃত্যু (১৮৮৬)<br>২. ক্রয়েটজার সোনাটা (১৮৯১)<br>৩. হাজী মুরাদ (১৯১২)<br><br><b>উল্লেখযোগ্য ছোটগল্প:</b><br>১. কতটুকু জমি দরকার (১৮৮৬)<br>২. লোকে কী নিয়ে বাঁচে (১৮৮১)<br>৩. ঈশ্বর সত্যদ্রষ্টা (১৮৭২)<br><br><b>উল্লেখযোগ্য নাটক:</b><br>১. অন্ধকারের ক্ষমতা (১৮৮৬)<br>২. শিক্ষার পরিণাম (১৮৯১)<br>৩. জিন্দা লাশ (১৯১১)<br><br><b>দর্শন ও সামাজিক জীবন:</b><br>পাদ্রী-পুরোহিতদের ভণ্ডামির সমালোচনা করায় তাকে খ্রিস্টধর্ম থেকে বহিষ্কার করা হয়। জার শাসনের বিরুদ্ধে সর্বদা সোচ্চার ছিলেন। নিজ জমিদারিতে দরিদ্র চাষাদের ছেলে-মেয়েদের জন্য স্কুল খুলে নিজে পড়াতেন।<br><br><b>পুরস্কার ও সম্মান:</b><br>১৯০২ থেকে ১৯০৬ পর্যন্ত প্রতি বছর সাহিত্যে নোবেল পুরস্কারের জন্য এবং ১৯০১, ১৯০২ ও ১৯১০ সালে শান্তিতে নোবেল পুরস্কারের জন্য মনোনীত হন। পুরস্কার না পাওয়াটি নোবেল ইতিহাসের অন্যতম বড় বিতর্ক।<br><br><b>শেষ জীবন ও মৃত্যু:</b><br>শেষ বয়সে সন্তের জীবন যাপন করতে চেয়েছিলেন - নিজে জুতো বানিয়ে পরতেন, চাষার পোশাক পরতেন। ৮২ বছর বয়সে বাড়ি থেকে পালিয়ে যাওয়ার পথে আস্তাপভা রেলওয়ে স্টেশনে নিউমোনিয়ায় আক্রান্ত হয়ে ২০ নভেম্বর ১৯১০ সালে মারা যান। তার শেষ যাত্রায় হাজার হাজার কৃষক ধর্মীয় আচার ছাড়াই তাকে সমাহিত করে।'
},
  'জসীম উদ্দীন': {
  img: 'https://i.ibb.co/PsdPqjNK/polli-kobi-jasimuddin.png',
  bio: 'পল্লীকবি জসীম উদ্দীন (১ জানুয়ারি ১৯০৩ – ১৩ মার্চ ১৯৭৬) বাংলা সাহিত্যের অন্যতম শ্রেষ্ঠ কবি, গীতিকার, ঔপন্যাসিক ও লোকসাহিত্য সংগ্রাহক। গ্রামীণ বাংলার প্রকৃতি, মানুষের জীবন, সুখ-দুঃখ ও লোকসংস্কৃতিকে অসাধারণ শিল্পরূপ দেওয়ার জন্য তিনি "পল্লীকবি" নামে সমধিক পরিচিত।<br><br><b>জন্ম ও শিক্ষাজীবন:</b> ফরিদপুর জেলার তাম্বুলখানা গ্রামে মাতুলালয়ে জন্মগ্রহণ করেন। তাঁর পৈতৃক নিবাস একই জেলার গোবিন্দপুর গ্রামে। ১৯২১ সালে ফরিদপুর জেলা স্কুল থেকে প্রবেশিকা পরীক্ষায় উত্তীর্ণ হন এবং ১৯৩১ সালে কলকাতা বিশ্ববিদ্যালয় থেকে বাংলা ভাষা ও সাহিত্যে এম.এ ডিগ্রি অর্জন করেন।<br><br><b>কর্মজীবন:</b> ছাত্রাবস্থায় দীনেশচন্দ্র সেনের অধীনে রামতনু লাহিড়ী গবেষণা সহকারী হিসেবে কাজ করেন। ১৯৩৮ সালে ঢাকা বিশ্ববিদ্যালয়ের বাংলা বিভাগে প্রভাষক হিসেবে যোগদান করেন। পরবর্তীতে পূর্ব পাকিস্তান সরকারের তথ্য ও প্রচার বিভাগে উচ্চপদস্থ কর্মকর্তা হিসেবে দায়িত্ব পালন করেন।<br><br><b>সাহিত্যকর্ম:</b> গ্রামীণ জীবন ও বাংলার লোকঐতিহ্যকে তিনি বাংলা সাহিত্যে অনন্য উচ্চতায় নিয়ে গেছেন। তাঁর কালজয়ী রচনার মধ্যে রয়েছে <i>কবর</i>, <i>নকশী কাঁথার মাঠ</i>, <i>সোজন বাদিয়ার ঘাট</i>, <i>রাখালী</i>, <i>বালুচর</i>, <i>ধানক্ষেত</i> এবং <i>রঙিলা নায়ের মাঝি</i>।<br><br><b>সঙ্গীত অবদান:</b> তিনি একজন সফল গীতিকারও ছিলেন। তাঁর রচিত জনপ্রিয় গানের মধ্যে রয়েছে <i>আরে ও রঙিলা নায়ের মাঝি</i>, <i>উজান গাঙের নাইয়া</i> এবং <i>আমার বন্ধু বিনোদিয়ারে</i>।<br><br><b>মৃত্যু:</b> ১৩ মার্চ ১৯৭৬ সালে ঢাকায় মৃত্যুবরণ করেন। তাঁর ইচ্ছানুসারে ফরিদপুরের গোবিন্দপুর গ্রামে ডালিম গাছের নিচে তাঁকে সমাহিত করা হয়।'
},
  'শামসুর রাহমান': {
  img: 'https://i.postimg.cc/wvGT8FjH/shamsur-rahman.webp',
  bio: 'শামসুর রাহমান (২৩ অক্টোবর ১৯২৯ – ১৭ আগস্ট ২০০৬) ছিলেন বাংলাদেশ ও আধুনিক বাংলা সাহিত্যের অন্যতম প্রধান, জনপ্রিয় এবং প্রভাবশালী নাগরিক কবি, সাংবাদিক ও কলামিস্ট। বিংশ শতাব্দীর দ্বিতীয় ভাগে তিনি আধুনিক কবি হিসেবে বাংলা কবিতায় এক অনন্য নান্দনিকতা ও নতুন মাত্রা যোগ করেন। তৎকালীন পাকিস্তান আমল থেকে শুরু করে বাংলাদেশের স্বাধীনতা সংগ্রাম এবং পরবর্তী সকল গণতান্ত্রিক আন্দোলনে তাঁর কবিতা ও লেখনী বাঙালি জাতিকে গভীরভাবে অনুপ্রাণিত করেছিল।<br><br><b>সংক্ষিপ্ত পরিচয়:</b><br>• জন্ম: ২৩ অক্টোবর ১৯২৯, মাহুতটুলী, পুরান ঢাকা।<br>• পৈতৃক নিবাস: পাড়াতলী, রায়পুরা, নরসিংদী।<br>• পিতা: মোখলেসুর রহমান চৌধুরী, মাতা: আমেনা খাতুন।<br>• শিক্ষা: পোগোজ স্কুল থেকে ম্যাট্রিক (১৯৪৫), ঢাকা কলেজ থেকে আই.এ (১৯৪৭), ঢাকা বিশ্ববিদ্যালয় থেকে স্নাতক।<br>• উপাধি: নাগরিক কবি, মুক্তিযুদ্ধের কবি।<br>• ছদ্মনাম: সিন্দবাদ, চক্ষুষ্মান, লিপিকার, মৈনাক, মজলুম আদিব।<br>• মৃত্যু: ১৭ আগস্ট ২০০৬, ঢাকা।<br><br><b>সাহিত্যিক বৈশিষ্ট্য:</b><br>শামসুর রাহমানকে আক্ষরিক অর্থেই বাংলা সাহিত্যের "নাগরিক কবি" বলা হয়। তাঁর কবিতায় ঢাকা শহরের আর্থ-সামাজিক, রাজনৈতিক বাস্তবতা এবং নাগরিক জীবনের সুখ-দুঃখ ও একাকিত্ব চমৎকারভাবে ফুটে উঠেছে।<br><br><b>উল্লেখযোগ্য সাহিত্যকর্ম:</b><br>তাঁর মোট কাব্যগ্রন্থের সংখ্যা ৬৬টি, এছাড়া ৪টি উপন্যাস এবং বেশ কিছু প্রবন্ধ ও শিশুতোষ গ্রন্থ রচনা করেছেন।<br><br><b>বিখ্যাত কবিতা:</b><br>১. স্বাধীনতা তুমি<br>২. তোমাকে পাওয়ার জন্য হে স্বাধীনতা<br>৩. আসাদের শার্ট<br>৪. বর্ণমালা, আমার দুঃখিনী বর্ণমালা<br>৫. টেলেমেকাস<br><br><b>উল্লেখযোগ্য কাব্যগ্রন্থ:</b><br>১. প্রথম গান, দ্বিতীয় মৃত্যুর আগে - ১৯৬০<br>২. রৌদ্র করোটিতে - ১৯৬৩<br>৩. বিধ্বস্ত নিলীমা - ১৯৬৭<br>৪. নিজ বাসভূমে - ১৯৭০<br>৫. বন্দী শিবির থেকে - ১৯৭২<br><br><b>উল্লেখযোগ্য উপন্যাস:</b><br>১. অক্টোপাস - ১৯৮৩<br>২. অদ্ভুত আঁধার এক - ১৯৮৫<br>৩. নিয়ত মন্তাজ - ১৯৮৫<br>৪. এলো সে অবেলায় - ১৯৯৬<br><br><b>পুরস্কার ও সম্মাননা:</b><br>• আদমজী সাহিত্য পুরস্কার<br>• বাংলা একাডেমি সাহিত্য পুরস্কার - ১৯৬৯<br>• একুশে পদক - ১৯৭৭<br>• স্বাধীনতা পুরস্কার - ১৯৯১<br>• আনন্দ পুরস্কার - ভারত<br>• যাদবপুর ও রবীন্দ্রভারতী বিশ্ববিদ্যালয় থেকে সম্মানসূচক ডি.লিট. ডিগ্রি<br><br><b>অবদান:</b><br>শামসুর রাহমান বাংলাদেশের মুক্তিযুদ্ধ, গণতান্ত্রিক আন্দোলন ও নাগরিক চেতনার অন্যতম প্রধান কাব্যিক কণ্ঠস্বর। তাঁর কবিতা আজও বাঙালির সংগ্রাম ও স্বাধীনতার প্রেরণা।'
},
  'জীবনানন্দ দাশ': {
  img: 'https://i.ibb.co/mVsdpSqv/jibanananda-das.jpg',
  bio: 'জীবনানন্দ দাশ (১৭ ফেব্রুয়ারি ১৮৯৯ – ২২ অক্টোবর ১৯৫৪) ছিলেন বিংশ শতাব্দীর অন্যতম প্রধান আধুনিক বাঙালি কবি, লেখক, ঔপন্যাসিক ও প্রাবন্ধিক। বাংলা কাব্যে আধুনিকতার পথিকৃৎ এই কবিকে তাঁর প্রকৃতিপ্রেম, গভীর জীবনবোধ, ইতিহাসচেতনা ও নিঃসঙ্গতার অনন্য প্রকাশভঙ্গির জন্য "রূপসী বাংলার কবি" বলা হয়। বুদ্ধদেব বসু তাঁকে "নির্জনতম কবি" এবং রবীন্দ্রনাথ ঠাকুর তাঁর কবিতাকে "চিত্ররূপময়" বলে অভিহিত করেছিলেন।<br><br><b>জন্ম ও শিক্ষাজীবন:</b><br>১৭ ফেব্রুয়ারি ১৮৯৯ সালে বরিশালে জন্মগ্রহণ করেন। পিতা সত্যানন্দ দাশ এবং মাতা কুসুমকুমারী দাশ—উভয়েই সাহিত্যচর্চার সঙ্গে যুক্ত ছিলেন। বরিশাল ব্রজমোহন কলেজ থেকে পড়াশোনা শেষ করে কলকাতা বিশ্ববিদ্যালয় থেকে ইংরেজি সাহিত্যে স্নাতকোত্তর ডিগ্রি অর্জন করেন।<br><br><b>কর্মজীবন:</b><br>তিনি বিভিন্ন কলেজে ইংরেজি সাহিত্যের অধ্যাপক হিসেবে কর্মরত ছিলেন। শিক্ষকতার পাশাপাশি সাহিত্যচর্চাই ছিল তাঁর জীবনের প্রধান সাধনা।<br><br><b>সাহিত্যকর্ম:</b><br>বাংলা কবিতায় তিনি সম্পূর্ণ নতুন এক আধুনিক ধারার সূচনা করেন। তাঁর কবিতায় প্রকৃতি, সময়, স্মৃতি, নিঃসঙ্গতা, মৃত্যু ও মানবজীবনের গভীর দর্শন অনন্যভাবে ফুটে উঠেছে।<br><br><b>উল্লেখযোগ্য কাব্যগ্রন্থ:</b><br>১. ঝরা পালক (১৯২৭)<br>২. ধূসর পাণ্ডুলিপি (১৯৩৬)<br>৩. বনলতা সেন (১৯৪২)<br>৪. মহাপৃথিবী (১৯৪৪)<br>৫. সাতটি তারার তিমির (১৯৪৮)<br>৬. রূপসী বাংলা (মরণোত্তর প্রকাশিত, ১৯৫৭)<br><br><b>অন্যান্য রচনা:</b><br>কবিতার পাশাপাশি তিনি উপন্যাস, ছোটগল্প ও প্রবন্ধও রচনা করেছেন। তাঁর সাহিত্যকর্ম বাংলা আধুনিক সাহিত্যের অন্যতম গুরুত্বপূর্ণ সম্পদ হিসেবে বিবেচিত।<br><br><b>জীবনাবসান:</b><br>১৯৫৪ সালের ২২ অক্টোবর কলকাতায় মৃত্যুবরণ করেন। মৃত্যুর পর তাঁর বহু অপ্রকাশিত রচনা প্রকাশিত হয় এবং বাংলা সাহিত্যে তাঁর মর্যাদা আরও সুদৃঢ় হয়।'
},
  'শরৎচন্দ্র চট্টোপাধ্যায়': {
  img: 'https://i.ibb.co/7M3Zrqr/shorathchandro-chattopatdhay.jpg',
  bio: 'শরৎচন্দ্র চট্টোপাধ্যায় (১৫ সেপ্টেম্বর ১৮৭৬ – ১৬ জানুয়ারি ১৯৩৮) ছিলেন বাংলা সাহিত্যের অন্যতম জনপ্রিয় ঔপন্যাসিক, গল্পকার ও প্রাবন্ধিক। বাংলা সাহিত্যে তাঁর অসাধারণ জনপ্রিয়তা এবং মানবজীবনের বাস্তব চিত্র তুলে ধরার অনন্য দক্ষতার জন্য তিনি "অপরাজেয় কথাশিল্পী" নামে সমধিক পরিচিত। গ্রামীণ সমাজ, মধ্যবিত্ত মানুষের জীবনসংগ্রাম, প্রেম, মানবিকতা এবং বিশেষ করে নারীর মনস্তত্ত্ব তাঁর সাহিত্যকর্মের প্রধান বিষয়।<br><br><b>জন্ম ও শিক্ষাজীবন:</b><br>১৫ সেপ্টেম্বর ১৮৭৬ সালে হুগলি জেলার দেবানন্দপুর গ্রামে জন্মগ্রহণ করেন। পিতা মতিলাল চট্টোপাধ্যায় এবং মাতা ভুবনমোহিনী দেবী। আর্থিক সংকটের কারণে তাঁর প্রাতিষ্ঠানিক শিক্ষাজীবন এফ.এ. শ্রেণিতে পড়ার সময়ই থেমে যায়।<br><br><b>কর্মজীবন:</b><br>জীবনের একটি সময় তিনি বার্মা (বর্তমান মিয়ানমার) রেলওয়ের হিসাব বিভাগে চাকরি করেন। পরবর্তীতে ভারতীয় জাতীয় কংগ্রেসের রাজনীতির সঙ্গে যুক্ত হয়ে হাওড়া জেলা কংগ্রেসের সভাপতির দায়িত্বও পালন করেন।<br><br><b>সাহিত্যকর্ম:</b><br>বাংলা উপন্যাসকে সাধারণ মানুষের জীবনের সঙ্গে নিবিড়ভাবে যুক্ত করার ক্ষেত্রে তাঁর অবদান অনন্য। তাঁর অধিকাংশ উপন্যাস বিভিন্ন ভাষায় অনূদিত হয়েছে এবং বহু জনপ্রিয় চলচ্চিত্র নির্মিত হয়েছে।<br><br><b>উল্লেখযোগ্য গ্রন্থসমূহ:</b><br>১. বড়দিদি<br>২. দেবদাস<br>৩. শ্রীকান্ত (চার খণ্ড)<br>৪. চরিত্রহীন<br>৫. পথের দাবী<br>৬. পরিণীতা<br>৭. দত্তা<br>৮. পল্লীসমাজ<br>৯. গৃহদাহ<br>১০. শেষ প্রশ্ন<br><br><b>সম্মাননা:</b><br>১৯২৩ সালে কলকাতা বিশ্ববিদ্যালয় থেকে জগত্তারিণী স্বর্ণপদক লাভ করেন। ১৯৩৬ সালে ঢাকা বিশ্ববিদ্যালয় তাঁকে সম্মানসূচক ডি.লিট উপাধিতে ভূষিত করে।<br><br><b>জীবনাবসান:</b><br>১৬ জানুয়ারি ১৯৩৮ সালে কলকাতায় মৃত্যুবরণ করেন। বাংলা সাহিত্যে তাঁর সৃষ্টি আজও সমানভাবে পাঠকপ্রিয় এবং কালজয়ী।'
},
  'বঙ্কিমচন্দ্র চট্টোপাধ্যায়': {
  img: 'https://i.postimg.cc/L5vyxWwQ/bankim-chandra-chatterjee.jpg',
  bio: 'সাহিত্য সম্রাট বঙ্কিমচন্দ্র চট্টোপাধ্যায় (২৬ জুন ১৮৩৮ – ৮ এপ্রিল ১৮৯৪) ছিলেন উনিশ শতকের অন্যতম শ্রেষ্ঠ বাঙালি ঔপন্যাসিক, প্রাবন্ধিক ও সাংবাদিক। বাংলা গদ্য ও উপন্যাসের বিকাশে তাঁর অসামান্য অবদানের জন্য তাঁকে "বাংলা উপন্যাসের জনক" বলা হয়। তিনি ভারতের জাতীয় স্তোত্র <b>বন্দে মাতরম্</b>-এর রচয়িতা।<br><br><b>জন্ম ও পরিচয়:</b> ২৬ জুন ১৮৩৮ সালে উত্তর ২৪ পরগনার কাঁঠালপাড়া গ্রামে জন্মগ্রহণ করেন। পেশাগত জীবনে তিনি ব্রিটিশ সরকারের ডেপুটি ম্যাজিস্ট্রেট ও ডেপুটি কালেক্টর হিসেবে দায়িত্ব পালন করেন। কলকাতা বিশ্ববিদ্যালয়ের প্রথম ব্যাচের অন্যতম বিএ পাস ছাত্র ছিলেন।<br><br><b>সাহিত্যকর্ম:</b> বাংলা সাহিত্যে তাঁর মোট ১৪টি উপন্যাস বিশেষভাবে সমাদৃত। উল্লেখযোগ্য রচনার মধ্যে রয়েছে <i>দুর্গেশনন্দিনী</i>, <i>কপালকুণ্ডলা</i>, <i>বিষবৃক্ষ</i>, <i>আনন্দমঠ</i> ও <i>দেবী চৌধুরাণী</i>।<br><br><b>অন্যান্য অবদান:</b> ১৮৭২ সালে তিনি <b>বঙ্গদর্শন</b> সাহিত্য পত্রিকা প্রতিষ্ঠা করেন। তাঁর <i>আনন্দমঠ</i> উপন্যাস এবং <b>বন্দে মাতরম্</b> গান ভারতের স্বাধীনতা আন্দোলনে বিশেষ অনুপ্রেরণা জুগিয়েছিল।<br><br><b>মৃত্যু:</b> ৮ এপ্রিল ১৮৯৪ সালে কলকাতায় তিনি মৃত্যুবরণ করেন।'
},
  'হুমায়ূন আহমেদ': {
  img: 'https://i.ibb.co/W4vJYtn0/humayun-ahmed.png',
  bio: 'হুমায়ূন আহমেদ (১৩ নভেম্বর ১৯৪৮ – ১৯ জুলাই ২০১২) ছিলেন বাংলাদেশের সর্বকালের অন্যতম জনপ্রিয় কথাসাহিত্যিক, নাট্যকার, গীতিকার, চিত্রনাট্যকার ও চলচ্চিত্র নির্মাতা। বাংলা কথাসাহিত্যে সংলাপপ্রধান সহজ-সরল ভাষাশৈলীর প্রবর্তক হিসেবে তিনি বিশেষভাবে সমাদৃত। বিজ্ঞান কল্পকাহিনি, উপন্যাস, নাটক ও চলচ্চিত্র—সব ক্ষেত্রেই তিনি অনন্য অবদান রেখে বাংলা সাহিত্যে এক স্বতন্ত্র ধারা সৃষ্টি করেছেন।<br><br><b>জন্ম ও শিক্ষাজীবন:</b><br>১৩ নভেম্বর ১৯৪৮ সালে নেত্রকোণার মোহনগঞ্জে জন্মগ্রহণ করেন। পিতা শহীদ পুলিশ কর্মকর্তা ফয়জুর রহমান আহমেদ এবং মাতা আয়েশা ফয়েজ। ঢাকা বিশ্ববিদ্যালয় থেকে রসায়নে উচ্চশিক্ষা সম্পন্ন করে পরবর্তীতে একই বিশ্ববিদ্যালয়ের রসায়ন বিভাগে অধ্যাপনা করেন।<br><br><b>কর্মজীবন:</b><br>বিশ্ববিদ্যালয়ে শিক্ষকতার পাশাপাশি সাহিত্যচর্চা শুরু করেন। পরবর্তীতে লেখালেখি ও চলচ্চিত্র নির্মাণে সম্পূর্ণভাবে আত্মনিয়োগ করেন এবং বাংলা সাহিত্য ও বিনোদন জগতে অসাধারণ জনপ্রিয়তা অর্জন করেন।<br><br><b>সাহিত্যকর্ম:</b><br>তিনি তিন শতাধিক গ্রন্থ রচনা করেছেন। তাঁর সৃষ্ট হিমু, মিসির আলি এবং শুভ্র বাংলা সাহিত্যের সবচেয়ে জনপ্রিয় কাল্পনিক চরিত্রগুলোর মধ্যে অন্যতম।<br><br><b>উল্লেখযোগ্য গ্রন্থ:</b><br>১. নন্দিত নরকে<br>২. শঙ্খনীল কারাগার<br>৩. জোছনা ও জননীর গল্প<br>৪. মধ্যাহ্ন<br>৫. বাদশাহ নামদার<br>৬. দেয়াল<br><br><b>নাটক ও চলচ্চিত্র:</b><br>টেলিভিশন নাটকের মাধ্যমে তিনি নতুন ধারার সূচনা করেন। তাঁর জনপ্রিয় নাটকের মধ্যে রয়েছে <i>এইসব দিনরাত্রি</i>, <i>বহুব্রীহি</i>, <i>কোথাও কেউ নেই</i> এবং <i>আজ রবিবার</i>। চলচ্চিত্র নির্মাতা হিসেবেও তিনি সমান সফল। তাঁর পরিচালিত উল্লেখযোগ্য চলচ্চিত্র হলো <i>আগুনের পরশমণি</i>, <i>শ্রাবণ মেঘের দিন</i>, <i>শ্যামল ছায়া</i>, <i>দুই দুয়ারী</i> এবং <i>ঘেটুপুত্র কমলা</i>।<br><br><b>সম্মাননা:</b><br>বাংলা সাহিত্যে অসামান্য অবদানের জন্য ১৯৮১ সালে বাংলা একাডেমি সাহিত্য পুরস্কার, ১৯৯৪ সালে একুশে পদক এবং বিভিন্ন সময়ে একাধিক জাতীয় চলচ্চিত্র পুরস্কার লাভ করেন।<br><br><b>জীবনাবসান:</b><br>১৯ জুলাই ২০১২ সালে যুক্তরাষ্ট্রের নিউইয়র্কে চিকিৎসাধীন অবস্থায় মৃত্যুবরণ করেন। বাংলা সাহিত্য, নাটক ও চলচ্চিত্রে তাঁর অবদান আজও সমানভাবে সমাদৃত এবং প্রজন্মের পর প্রজন্ম পাঠক-দর্শকদের অনুপ্রেরণা জোগাচ্ছে।'
},
  'নির্মলেন্দু গুণ': {
  img: 'https://i.ibb.co/v4Fywdqb/nirmalendu-goon.jpg',
  bio: 'নির্মলেন্দু গুণ (পূর্ণনাম: নির্মলেন্দু প্রকাশ গুণ চৌধুরী) বাংলাদেশের অন্যতম জনপ্রিয় আধুনিক কবি, সাহিত্যিক, গদ্যকার ও চিত্রশিল্পী। সত্তরের দশক থেকে তাঁর প্রতিবাদী, সমাজসচেতন, প্রেমময় ও দেশপ্রেমমূলক কবিতার মাধ্যমে তিনি বাংলা সাহিত্যে এক স্বতন্ত্র অবস্থান গড়ে তুলেছেন। সহজ-সরল ভাষায় গভীর রাজনৈতিক চেতনা, মানবিকতা ও আবেগ প্রকাশ তাঁর কবিতার অন্যতম বৈশিষ্ট্য।<br><br><b>জন্ম ও প্রারম্ভিক জীবন:</b><br>২১ জুন ১৯৪৫ সালে নেত্রকোণা জেলার বারহাট্টা উপজেলার কাশবন গ্রামে জন্মগ্রহণ করেন। পিতা সুখেন্দু প্রকাশ গুণ এবং মাতা বীণাপাণি। শৈশবে তাঁর ডাকনাম ছিল "রতন"।<br><br><b>সাহিত্যকর্ম:</b><br>নারীপ্রেম, শ্রেণীসংগ্রাম, মুক্তিযুদ্ধ, স্বৈরাচারবিরোধী আন্দোলন এবং দেশপ্রেম তাঁর কবিতার প্রধান উপজীব্য। কবিতার পাশাপাশি তিনি গল্প, গদ্য, ভ্রমণকাহিনি রচনা করেছেন এবং চিত্রশিল্পী হিসেবেও পরিচিত।<br><br><b>উল্লেখযোগ্য গ্রন্থ ও কবিতা:</b><br>১. প্রেমাংশুর রক্ত চাই (প্রথম কাব্যগ্রন্থ, ১৯৭০)<br>২. হুলিয়া<br>৩. স্বাধীনতা, এই শব্দটি কীভাবে আমাদের হলো<br>৪. মানুষ<br>৫. তোমার চোখ এত লাল কেন<br>৬. আফ্রিকার প্রেমের কবিতা<br>৭. আমি আজ কারো রক্ত চাইতে আসিনি<br><br><b>সম্মাননা:</b><br>বাংলা সাহিত্যে অসামান্য অবদানের জন্য ১৯৮২ সালে বাংলা একাডেমি সাহিত্য পুরস্কার, ২০০১ সালে একুশে পদক এবং ২০১৬ সালে স্বাধীনতা পুরস্কার লাভ করেন।<br><br><b>অবদান:</b><br>সমকালীন বাংলা কবিতার অন্যতম প্রধান কণ্ঠস্বর হিসেবে নির্মলেন্দু গুণ আজও পাঠকসমাজে সমানভাবে জনপ্রিয়। তাঁর কবিতায় প্রতিবাদ, প্রেম, মানবতা ও স্বাধীনতার চেতনা এক অনন্য শিল্পরূপে প্রকাশ পেয়েছে।'
},
  'চণ্ডীদাস': {
  img: 'https://i.postimg.cc/m29gyZCS/chondi-das.jpg',
  bio: 'মধ্যযুগের প্রখ্যাত বৈষ্ণব পদকর্তা চণ্ডীদাস (১৩৩৯–১৩৯৯) বাংলা সাহিত্যের আদি-মধ্যযুগের অন্যতম শ্রেষ্ঠ কবি। বৈষ্ণব পদাবলীর মাধ্যমে তিনি মানবিক প্রেম, ভক্তি এবং সহজিয়া ভাবধারাকে এক অনন্য উচ্চতায় পৌঁছে দেন। তাঁর রচিত পদাবলী চৈতন্যদেবের আবির্ভাবের পূর্বেই বাংলার মানুষের মুখে মুখে ছড়িয়ে পড়ে এবং পরবর্তীকালে চৈতন্যদেব নিজেও তাঁর পদ গভীর শ্রদ্ধার সঙ্গে আস্বাদন করতেন।<br><br><b>জীবন ও পরিচয়:</b> চণ্ডীদাসের জীবন সম্পর্কে নির্ভরযোগ্য তথ্য খুবই সীমিত। জনশ্রুতি অনুযায়ী রজকিনী রামী তাঁর সহজসাধনার সঙ্গিনী ছিলেন। তাঁর রচনায় মানবপ্রেম, ঈশ্বরপ্রেম এবং সমাজের প্রচলিত ভেদাভেদের বিরুদ্ধে এক গভীর মানবিক চেতনা প্রকাশ পেয়েছে।<br><br><b>সাহিত্যকর্ম:</b> বৈষ্ণব পদাবলীর অন্যতম শ্রেষ্ঠ রচয়িতা হিসেবে চণ্ডীদাস বাংলা সাহিত্যে চিরস্মরণীয়। তাঁর পদে রাধা-কৃষ্ণের প্রেম, মানবিক অনুভূতি, আধ্যাত্মিকতা এবং সহজিয়া দর্শনের অসাধারণ প্রকাশ দেখা যায়।<br><br><b>উল্লেখযোগ্য পদ:</b><br>• "ব্রহ্মাণ্ড ব্যাপিয়া আছয়ে যে জন, কেহ না জানয়ে তারে; প্রেমের আরতি যে জন জানয়ে সেই সে চিনিতে পারে।"<br>• "কহে চণ্ডীদাস, কানুর পিরীতি – জাতিকুলশীল ছাড়া।"<br>• "প্রণয় করিয়া ভাঙ্গয়ে যে, সাধন-অঙ্গ পায় না সে।"<br>• "কি লাগিয়া ডাকরে বাঁশী, আর কিবা চাও; বাকি আছে প্রাণ আমার, তাহা লৈয়া যাও।"<br><br><b>অমর বাণী:</b><br>"শুনহ মানুষ ভাই, সবার উপরে মানুষ সত্য, তাহার উপরে নাই।"<br><br>এই মানবতাবাদী বাণী বাংলা সাহিত্য ও সংস্কৃতিতে আজও সমানভাবে প্রাসঙ্গিক এবং চণ্ডীদাসকে মধ্যযুগের অন্যতম শ্রেষ্ঠ মানবতাবাদী কবি হিসেবে প্রতিষ্ঠিত করেছে।'
},
  'মাইকেল মধুসূদন দত্ত': {
  img: 'https://i.postimg.cc/SxRw24XZ/michael-madhusudan-dutt.webp',
  bio: 'মাইকেল মধুসূদন দত্ত (১৮২৪–১৮৭৩) ছিলেন ১৯ শতকের অন্যতম শ্রেষ্ঠ বাঙালি কবি, নাট্যকার এবং বাংলা নবজাগরণ সাহিত্যের প্রধান পুরোধা ব্যক্তিত্ব। বাংলা সাহিত্যে প্রথম আধুনিকতার প্রবর্তন এবং চিরাচরিত নিয়ম ভেঙে নতুন ধারা সৃষ্টির জন্য তাঁকে প্রথম আধুনিক ও বিদ্রোহী কবি হিসেবে গণ্য করা হয়। তিনি বাংলা ভাষায় প্রথম অমিত্রাক্ষর ছন্দ এবং সনেট (চতুর্দশপদী কবিতা) প্রবর্তন করেন।<br><br><b>জন্ম ও শিক্ষা:</b> ২৫ জানুয়ারি, ১৮২৪ সালে যশোরের সাগরদাঁড়ি গ্রামে জন্মগ্রহণ করেন। পিতা রাজনারায়ণ দত্ত ছিলেন কলকাতার প্রতিষ্ঠিত উকিল, মাতা জাহ্নবী দেবী। কলকাতার হিন্দু কলেজ ও বিশপস কলেজে শিক্ষা লাভ করেন।<br><br><b>জীবন ও ধর্মান্তর:</b> ছোটবেলা থেকেই পাশ্চাত্য সংস্কৃতির প্রতি তীব্রভাবে আকৃষ্ট ছিলেন এবং ইংরেজি ভাষার বড় কবি হওয়ার স্বপ্ন দেখতেন। ১৮৪৩ সালে হিন্দু বিয়ে এড়াতে এবং বিলেত যাওয়ার আকাঙ্ক্ষায় তিনি খ্রিস্টধর্ম গ্রহণ করেন এবং নামের শুরুতে ‘মাইকেল’ যুক্ত করেন। তবে জীবনের শেষভাগে পাশ্চাত্য মোহ থেকে মুক্ত হয়ে গভীর মাতৃভাষা প্রীতিতে ফিরে আসেন, যা ‘কপোতাক্ষ নদ’ কবিতায় প্রকাশ পায়।<br><br><b>সাহিত্যিক অবদান:</b> বাংলা সাহিত্যের প্রায় প্রতিটি শাখায় তিনি বৈপ্লবিক পরিবর্তন এনেছিলেন। ‘মেঘনাদবধ কাব্য’ (১৮৬১) বাংলা সাহিত্যের প্রথম ও শ্রেষ্ঠ সার্থক ট্রাজিক মহাকাব্য। রামায়ণের রাবণ-চরিত্রকে খলনায়কের পরিবর্তে বীর ও দেশপ্রেমিক হিসেবে উপস্থাপন করে তিনি নতুন সাহিত্যিক বিদ্রোহের জন্ম দেন। ‘শর্মিষ্ঠা’ (১৮৫৯) বাংলা ভাষার প্রথম পাশ্চাত্য শৈলীর মৌলিক নাটক। ‘কৃষ্ণকুমারী’ বাংলা সাহিত্যের প্রথম সার্থক ট্র্যাজেডি নাটক। ‘বীরাঙ্গনা কাব্য’ ও ‘চতুর্দশপদী কবিতাবলী’ বাংলা সনেটের প্রথম সংকলন।<br><br><b>উল্লেখযোগ্য সৃষ্টি:</b><br>• মহাকাব্য: মেঘনাদবধ কাব্য<br>• নাটক: শর্মিষ্ঠা, পদ্মাবতী, কৃষ্ণকুমারী<br>• প্রহসন: একেই কি বলে সভ্যতা?, বুড়ো শালিকের ঘাড়ে রোঁ<br>• কাব্যগ্রন্থ: বীরাঙ্গনা কাব্য, চতুর্দশপদী কবিতাবলী<br><br><b>শেষ জীবন:</b> পাশ্চাত্য জীবনযাত্রার উচ্চাভিলাষ এবং তীব্র ঋণের কারণে তাঁর শেষ জীবন চরম দারিদ্র্য ও কষ্টের মধ্যে কেটেছে। কঠিন সময়ে ঈশ্বরচন্দ্র বিদ্যাসাগর তাঁকে অর্থ পাঠিয়ে বড় বিপদ থেকে রক্ষা করেছিলেন। ১৮৭৩ সালে কলকাতার আলিপুর জেনারেল হাসপাতালে স্ত্রী হেনরিয়েটার মৃত্যুর মাত্র তিন দিন পর তিনি শেষ নিঃশ্বাস ত্যাগ করেন।<br><br><b>সমাধি-লিপি:</b><br>"দাঁড়াও, পথিক-বর, জন্ম যদি তব বঙ্গে!<br>তিষ্ঠ ক্ষণকাল! এ সমাধি-স্থলে..."<br><br>কলকাতার লোয়ার সার্কুলার রোড ক্রিশ্চিয়ান সেমেটারিতে সমাহিত এই মহাকবি বাংলা সাহিত্যে চির বিদ্রোহী ও আধুনিকতার পথিকৃৎ হিসেবে অমর হয়ে আছেন।'
},
  'ফজল-এ খোদা': {
  img: 'https://i.postimg.cc/CLSdYppJ/fazal-e-khuda.jpg',
  bio: 'ফজল-এ-খোদা (৯ মার্চ ১৯৪১ – ৪ জুলাই ২০২১) ছিলেন বাংলাদেশের বিশিষ্ট কবি, কালজয়ী গীতিকার, ছড়াকার, শিশুসংগঠক ও বীর মুক্তিযোদ্ধা। ১৯৭১ সালের মহান মুক্তিযুদ্ধে তাঁর লেখা দেশাত্মবোধক গান লাখো মানুষকে অনুপ্রাণিত করেছিল। বাংলাদেশ বেতারের সাবেক পরিচালক হিসেবে দায়িত্ব পালন করা এই গুণী ব্যক্তিত্ব সংগীতে অসামান্য অবদানের স্বীকৃতিস্বরূপ ২০২৩ সালে মরণোত্তর একুশে পদকে ভূষিত হন।<br><br><b>জন্ম ও পরিচয়:</b><br>• জন্ম: ৯ মার্চ ১৯৪১, পাবনা জেলার বেড়া উপজেলার বনগ্রাম।<br>• মৃত্যু: ৪ জুলাই ২০২১, ঢাকার শহীদ সোহরাওয়ার্দী মেডিকেল কলেজ হাসপাতালে করোনায় আক্রান্ত হয়ে মৃত্যুবরণ করেন।<br>• পেশাজীবন: ১৯৬৩ সালে তৎকালীন পাকিস্তান বেতারের তালিকাভুক্ত গীতিকার হিসেবে কর্মজীবন শুরু করেন এবং পরবর্তীতে বাংলাদেশ বেতারের পরিচালক হিসেবে অবসর গ্রহণ করেন।<br><br><b>মুক্তিযুদ্ধে অবদান:</b><br>১৯৭১ সালে ২ নম্বর সেক্টরের একজন বীর মুক্তিযোদ্ধা হিসেবে সরাসরি যুদ্ধে অংশগ্রহণ করেন। মুক্তিযুদ্ধে যোগ দেওয়ায় ১৯৭১ সালের ৪ এপ্রিল তাঁকে রেডিও পাকিস্তানের চাকরি থেকে বরখাস্ত করা হয়।<br><br><b>কালজয়ী গানসমূহ:</b><br>• সালাম সালাম হাজার সালাম — বিবিসির সর্বকালের সেরা বাংলা গানের তালিকায় ১২তম স্থান অর্জনকারী ঐতিহাসিক গান।<br>• সংগ্রাম, সংগ্রাম, সংগ্রাম চলবে — ১৯৭১ সালের অসহযোগ আন্দোলনের জনপ্রিয় গণসংগীত।<br>• যে দেশেতে শাপলা শালুক — বাংলাদেশের অন্যতম জনপ্রিয় দেশাত্মবোধক গান।<br>• অন্যান্য জনপ্রিয় গান: ভালোবাসার মূল্য কত আমি কিছু জানি না, কলসি কাঁধে ঘাটে যায় কোন রূপসী, বাসন্তী রং শাড়ি পরে কোন রমণী চলে যায় এবং ভাবনা আমার আহত পাখির মতো।<br><br><b>সাহিত্য ও শিশুসংগঠন:</b><br>শিশু-কিশোরদের কাছে তিনি ‘মিতা ভাই’ নামে অত্যন্ত জনপ্রিয় ছিলেন। তিনি শিশু-কিশোর সংগঠন <b>শাপলা শালুকের আসর</b> প্রতিষ্ঠা করেন এবং সত্তরের দশকে তাঁর সম্পাদনায় <b>শাপলা শালুক</b> নামে একটি মাসিক পত্রিকা প্রকাশিত হতো।'
},
  'ঈশ্বরচন্দ্র গুপ্ত': {
  img: 'https://i.postimg.cc/vZkvfSrg/ishwar-chandra-gupta.jpg',
  bio: 'ঈশ্বরচন্দ্র গুপ্ত (৬ মার্চ ১৮১২ - ২৩ জানুয়ারি ১৮৫৯) ঊনবিংশ শতাব্দীর একজন বাঙালি কবি, সাহিত্যিক এবং সাংবাদিক। তিনি সংবাদ প্রভাকর (বা \'সম্বাদ প্রভাকর\') এর সম্পাদক। ব্যাপকার্থে তিনি ঊনবিংশ শতাব্দীর একজন কবি ও সাহিত্যিক। তিনি বাংলা সাহিত্যের যুগসন্ধিক্ষণের কবি হিসেবে খ্যাত এবং "গুপ্ত কবি" নামেও পরিচিত ছিলেন। তাঁর হাত ধরেই বাংলা কবিতা জগৎ মধ্যযুগীয় সীমানা অতিক্রম করে আধুনিকতার পথে পা বাড়িয়েছিল। বঙ্কিমচন্দ্র চট্টোপাধ্যায় সহ তাঁর পরবর্তী বহু সাহিত্যিক তাঁকে \'গুরু\'পদে বরণ করেন।<br><br><b>জন্ম এবং পারিবারিক পরিচিতি:</b><br>তাঁর জন্ম উত্তর চব্বিশ পরগনা জেলার কাঞ্চনপল্লী (বর্তমানে কাঁচড়াপাড়া) গ্রামের এক সম্ভ্রান্ত বৈদ্য পরিবারে। তাঁর প্রপিতামহ নিধিরাম দাশগুপ্ত ছিলেন নামকরা কবিরাজ এবং পিতা হরিনারায়ণ দাশগুপ্ত আয়ুর্বেদিক চিকিৎসক ছিলেন। তাঁর মায়ের নাম ছিল শ্রীমতী। তিনি পারিবারিক পদবী দাশগুপ্ত পরিবর্তন করে গুপ্ত করেছিলেন। তাঁর বয়স যখন দশ তখন তার মা পরলোকগমন করেন। পিতা ২য় বিয়ে করলে তিনি কলকাতার জোড়াসাঁকোতে মামার বাড়িতে বাস করতে শুরু করেন। মাত্র ১৫ বছর বয়সে গৌরহরি মল্লিকের কন্যা দুর্গামণি দেবী রেবার সঙ্গে তাঁর বিয়ে হয়।<br><br><b>শিক্ষা জীবন:</b><br>শৈশবকালে লেখাপড়ার প্রতি অমনোযোগিতার কারণে তাঁর প্রাতিষ্ঠানিক শিক্ষা বেশিদূর অগ্রসর না হলেও, অসাধারণ মেধা ও স্মৃতিশক্তির জোরে তিনি নিজ চেষ্টায় বাংলা, সংস্কৃত ও ইংরেজি ভাষা শেখেন এবং বেদান্তদর্শনে যথেষ্ট পারদর্শিতা অর্জন করেন।<br><br><b>কর্ম জীবন ও সাংবাদিক অধ্যায়:</b><br>সংস্কৃত কলেজের অধ্যাপক প্রেমচন্দ্র তর্কবাগীশের প্রেরণায় এবং বন্ধু যোগেন্দ্রমোহন ঠাকুরের আনুকূল্যে ১৮৩১ খ্রিষ্টাব্দে তিনি সংবাদ প্রভাকর পত্রিকার সম্পাদনায় নিযুক্ত হন। ১৮৩২ সালে সংবাদ রত্নাবলী, ১৮৪৬ সালে সাপ্তাহিক পাষণ্ড এবং পরবর্তীতে সংবাদ সাধুরঞ্জন পত্রিকার সম্পাদনার দায়িত্ব পালন করেন। ১৮৩৬ সালে বন্ধ থাকা প্রভাকর পুনরায় চালু করে ১৮৩৯ সালে এটিকে দৈনিকে রূপান্তর করেন। আধুনিক বাংলার সমাজ গঠনে সংবাদ প্রভাকরের ভূমিকা ছিল অত্যন্ত গুরুত্বপূর্ণ। প্রথমে রক্ষণশীল হলেও পরে তিনি প্রগতিশীল ভাবধারার সঙ্গে যুক্ত হন এবং স্ত্রীশিক্ষার সমর্থন ও বৈজ্ঞানিক উন্নয়নের পক্ষে লেখেন।<br><br><b>সাহিত্যিক জীবন:</b><br>ভারতচন্দ্রের পর যখন মঙ্গলকাব্যের আদর্শ লুপ্ত হয়ে আসছিল, তখন তিনি বিভিন্ন বিষয় অবলম্বনে খণ্ডকবিতা রচনার আদর্শ প্রবর্তন করেন। ব্যঙ্গ-বিদ্রূপই ছিল তাঁর রচনার বিশেষত্ব, যা তিনি আয়ত্ত করেছিলেন কবিয়ালদের নিকট থেকে। তিনি সবসময় ইংরেজি প্রভাব বর্জিত খাঁটি বাংলা শব্দ ব্যবহার করতেন। তাঁর ভাষা ও ছন্দের ওপর বিস্ময়কর অধিকারের প্রমাণ পাওয়া যায় তাঁর বোধেন্দুবিকাশ (১৮৬৩) নাটকে। তাঁর অন্যতম শ্রেষ্ঠ কীর্তি হলো ভারতচন্দ্র রায়, রামপ্রসাদ সেন, নিধুগুপ্ত, হরু ঠাকুর ও কয়েকজন কবিয়ালের লুপ্তপ্রায় জীবনী উদ্ধার করে প্রকাশ করা।<br><br><b>সাহিত্যকীর্তি ও যমক:</b><br>বাংলা সাহিত্যে তাঁর চিরস্থায়ী আসনলাভ সম্ভব হয়েছে কারণ তিনি দেবমাহাত্ম্য থেকে বাংলা কবিতাকে মুক্ত করে \'পাঁঠা\', \'আনারস\', \'তোপসে মাছ\' ইত্যাদি বিষয় অবলম্বনে কবিতা লেখেন। যমক (একই বর্ণসমষ্টি একাধিকবার একাধিক অর্থে প্রয়োগ) ছিল তাঁর প্রিয় কাব্যকৌশল। যেমন: "প্রকাশিয়া প্রভাকর শুভ দিন দিন", "আনা দরে আনা যায় কত আনারস"। তাঁর উল্লেখযোগ্য কর্ম: রামপ্রসাদ সেন কৃত কালীকীর্তন (১৮৩৩), কবিবর ভারতচন্দ্র রায় ও তার জীবনবৃত্তান্ত (১৮৫৫)। বঙ্কিমচন্দ্র তাঁকে "খাঁটি বাঙালি কবি" বলে অবহিত করেছেন।'
},
  'ফিরোজ আহমেদ': {
  img: 'https://i.postimg.cc/s26vdYZh/firoz-ahmed.webp',
  bio: 'ফিরোজ আহমেদ (জন্ম ১৯৭৫) একজন বাংলাদেশী গবেষক, লেখক এবং সম্পাদক। তিনি বর্তমানে মুহাম্মদ ইউনূসের নেতৃত্বাধীন অন্তর্বর্তীকালীন সরকারের সংবিধান সংস্কার কমিশনের সদস্য এবং গণসংহতি আন্দোলনের কেন্দ্রীয় নেতা। বাংলাদেশের আইনি ও সাংবিধানিক বিষয়ে তাঁর গবেষণা এবং পর্যালোচনা ব্যাপকভাবে সমাদৃত।<br><br><b>জন্ম ও শিক্ষাজীবন:</b><br>১৯৭৫ সালে ঢাকায় জন্মগ্রহণ করেন। পিতা এম. এ. ওয়াজেদ এবং মাতা রাজিয়া বেগম। তিনি ঢাকার লেক সার্কাস কলাবাগান, রায়েরবাজার, ঝিগাতলা এবং উত্তরায় বেড়ে ওঠেন। নিউ মডেল হাই স্কুল এবং বিএএফ শাহীন কলেজ থেকে পড়াশোনা শেষ করে ঢাকা বিশ্ববিদ্যালয়ের আইন অনুষদ থেকে উচ্চশিক্ষা সম্পন্ন করেন।<br><br><b>কর্মজীবন:</b><br>তাঁর পেশাগত জীবন মূলত গবেষণা, লেখালেখি, সম্পাদনা এবং জন-আলোচনার উপর কেন্দ্রীভূত। তিনি সরকারি কর্মচারী হিসেবে এবং এশিয়ান ডেভেলপমেন্ট ব্যাংকে কাজ করেছেন। ১৯৭২ সালের সংবিধান প্রণয়ন প্রক্রিয়া নিয়ে তাঁর পর্যালোচনা একাডেমিক অঙ্গনে বহুলভাবে উল্লেখিত। তিনি সন্ত্রাসবিরোধী অভিযান এবং মার্কিন যুক্তরাষ্ট্রের সাথে সহযোগিতার সমালোচনা করে বলেছেন, "২০০০ সালের মার্কিন অর্থনৈতিক মন্দা এবং সন্ত্রাসের বিরুদ্ধে বিশ্বযুদ্ধের আগে ইসলাম এবং সন্ত্রাসবাদ শব্দ দুটি উচ্চারিত হতো না"। ফটোসাংবাদিক শফিকুল ইসলাম কাজলকে গ্রেপ্তারের বিষয়ে তিনি বলেন, "গণতন্ত্র মানে সংবাদপত্রের স্বাধীনতা। সাংবাদিকদের বিরুদ্ধে মামলা করা বা তাদের গ্রেপ্তার করার অর্থ হলো আপনি গণতন্ত্র চান না।"<br><br><b>গুরুত্বপূর্ণ ভূমিকা:</b><br>শেখ হাসিনার নেতৃত্বাধীন আওয়ামী লীগ সরকারের পতনের পর তিনি সংবিধান সংস্কার কমিশনের সদস্য হিসেবে নিযুক্ত হন। তিনি বঙ্গবন্ধু ভবন ভাঙার ঘটনার সমালোচনা করেন এবং সরকারকে উস্কানিদাতাদের বিরুদ্ধে ব্যবস্থা নেওয়ার আহ্বান জানান।<br><br><b>সাহিত্যকর্ম:</b><br>তিনি <i>Ajob Deshe Alice</i> গ্রন্থের সহ-প্রকাশক।<br><br><b>ব্যক্তিগত জীবন:</b><br>তিনি বাংলাদেশের বিশিষ্ট একাডেমিক প্রকাশনা সংস্থা দ্য ইউনিভার্সিটি প্রেস লিমিটেডের ব্যবস্থাপনা পরিচালক মাহরুখ মহিউদ্দিনের সাথে বিবাহিত। তিনি ইউপিএল-এর প্রতিষ্ঠাতা মহিউদ্দিন আহমেদের কন্যা।'
},
  'মাহমুদুল হাসান নিজামী': {
  img: 'https://i.postimg.cc/L4tJFpQg/images-1.jpg',
  bio: 'মাহমুদুল হাসান নিজামী একজন প্রখ্যাত বাংলাদেশী কবি, গবেষক, গীতিকার ও অনুবাদক। তিনি ১৯৭১ সালের ১ ফেব্রুয়ারি চট্টগ্রাম জেলার সন্দ্বীপে জন্মগ্রহণ করেন। তাঁর কবিতায় মানবতা, প্রেম, ইতিহাস, ঐতিহ্য এবং আধ্যাত্মিকতার এক গভীর সুর খুঁজে পাওয়া যায়। তিনি পাঁচ হাজারের অধিক কবিতা ও গান রচনা করেছেন এবং জাতীয় কবিতা মঞ্চের প্রতিষ্ঠাতা ও সভাপতি ছিলেন। বিশ্বসাহিত্যের ধ্রুপদী অনুবাদ এবং বহুভাষিক পন্ডিত হিসেবে তিনি পরিচিত ছিলেন। তিনি রংপুরে বেড়াতে গিয়ে হঠাৎ ইন্তেকাল করেন।<br><br><b>পরিচিতি ও জীবন:</b><br>• জন্ম: ১ ফেব্রুয়ারি ১৯৭১, কালাপানিয়া, সন্দ্বীপ, চট্টগ্রাম।<br>• মৃত্যু: মার্চ ২০২৬, রংপুরে বেড়াতে গিয়ে ইন্তেকাল করেন।<br>• পেশা: কবি, গবেষক, গীতিকার, সুরকার ও দৈনিক দেশজগতের সম্পাদক।<br>• পদবী: সভাপতি, জাতীয় কবিতা মঞ্চ।<br><br><b>সাহিত্যকর্ম ও অবদান:</b><br>• গ্রন্থ: তাঁর শতাধিক প্রকাশিত গ্রন্থ রয়েছে।<br>• অনুবাদ: শেখ সাদী, ফরিদ উদ্দিন আত্তার ও ইমরুল কায়েসের কবিতার প্রথম বাংলা কাব্যানুবাদ করেন।<br>• গান: এক হাজারেরও বেশি গান লিখেছেন ও প্রচার করেছেন।<br><br><b>উল্লেখযোগ্য কবিতা ও সাহিত্যকর্ম:</b><br>• প্রসিদ্ধ কবিতা ও বই: তাঁর জনপ্রিয় কাব্যগ্রন্থ ও লেখার মধ্যে রোমান্টিক কবিতার বই \'সর্বানী\', \'অতিতে ক্ষতি\' এবং \'একুশ মানে বর্ণমালার অপমান\' বিশেষভাবে উল্লেখযোগ্য।<br>• অনন্য অনুবাদকর্ম: বিশ্বসাহিত্যের শেখ সাদী, ফরিদ উদ্দিন আত্তার ও ইমরুল কায়েসের কাব্যের বাংলা অনুবাদে তাঁর অবদান অনন্য।<br><br><b>কবিতার মূল বৈশিষ্ট্য:</b><br>• বিষয়বস্তুর বৈচিত্র্য: তাঁর প্রতিটি কবিতা ও গানে নতুন স্বাদ ও ভিন্নধর্মী ভাবনা থাকে।<br>• ভাব ও ভাষা: আরবি, ফার্সি ও উর্দু সাহিত্যের গভীর প্রভাব থাকায় তাঁর কাব্যে আধ্যাত্মিক ও জ্ঞানমূলক এক গম্ভীর প্রকাশ দেখা যায়।'

  'ডা. গোলাম রহমান ব্রাইট': {
  img: 'https://i.postimg.cc/dtHqTS8q/Dr-Golam-Rahman-Bright.webp',
  bio: 'ডা. গোলাম রহমান ব্রাইট (জন্ম: ১৮ সেপ্টেম্বর ১৯৮০) একজন কবি, প্যারামেডিকেল, ফার্মাসিস্ট এবং সাহিত্যপ্রেমী। তিনি চিকিৎসাসেবার পাশাপাশি দীর্ঘদিন ধরে কবিতা, সাহিত্যচর্চা ও সৃজনশীল লেখালেখির সঙ্গে যুক্ত আছেন। তাঁর কবিতা মানবতা, জীবনবোধ, সমাজচেতনা ও সমকালীন বাস্তবতাকে গভীরভাবে তুলে ধরে।<br><br><b>সংক্ষিপ্ত পরিচয়:</b><br>• জন্ম: ১৮ সেপ্টেম্বর ১৯৮০, ফরিদপুর গ্রাম, কালিগঞ্জ, সাতক্ষীরা, বাংলাদেশ।<br>• পিতা: মো. মুনছুর আলী।<br>• মাতা: মোছা. রোকেয়া খাতুন।<br>• ভাইবোন: ৪ জন — কুলসুম খানম, ডা. গোলাম রহমান ব্রাইট, জাহাঙ্গীর আলম ও হালিমা খানম।<br><br><b>শিক্ষাজীবন:</b><br>নেংগী জুনিয়র স্কুল (তৎকালীন), চৌমুহনী মাধ্যমিক বিদ্যালয়, কালিগঞ্জ ডিগ্রি কলেজ (সাতক্ষীরা), শহীদ মশিউর রহমান ডিগ্রি কলেজ (ঝিকরগাছা, যশোর), ঢাকা মেডিকেল ইনস্টিটিউট (ডিএমআই) থেকে প্যারামেডিকেল ডিপ্লোমা এবং ঢাকা মেডিকেল কলেজ হাসপাতাল (ডিএমসিএইচ) হতে ইন্টার্নি সম্পন্ন করেন।<br><br><b>কর্মজীবন:</b><br>শৈশব ও কৈশোর গ্রামের পরিবেশে কাটলেও যশোর, ঝিকরগাছা, চট্টগ্রাম ও ঢাকায় বিভিন্ন সময়ে অবস্থান করেন। বর্তমানে নারায়ণগঞ্জের জালকুড়িতে মানুষের চিকিৎসাসেবার পাশাপাশি সাহিত্যচর্চা ও লেখালেখি চালিয়ে যাচ্ছেন।<br><br><b>উল্লেখযোগ্য একক কাব্যগ্রন্থ:</b><br>১. দূর নীলিমায়<br>২. নতুন পথের সন্ধানে<br>৩. গোলকধাঁধার পথে<br><br>এছাড়াও তাঁর অসংখ্য কবিতা ও যৌথ কাব্যগ্রন্থ দেশের বিভিন্ন পত্র-পত্রিকা, অনলাইন সংবাদমাধ্যম এবং সামাজিক যোগাযোগমাধ্যমে প্রকাশিত হয়েছে।<br><br><b>স্থায়ী ঠিকানা:</b><br>গ্রাম: ফরিদপুর, ডাকঘর: জহুরনগর, থানা: কালিগঞ্জ, জেলা: সাতক্ষীরা, বাংলাদেশ।<br><br><b>যোগাযোগ:</b><br>ইমেইল: grahmansatkhira@gmail.com<br>মোবাইল: 01712862283'

  'মারিয়া নূর': {
  img: 'https://i.ibb.co/Gv73jMb1/mst-marea-akhtar.jpg',
  bio: 'কবি ও লেখক মারিয়া আক্তার নূর, যিনি মারিয়া নূর নামেই সকলের কাছে পরিচিত। জন্ম: ৭ জুলাই ১৯৮৩, নওগাঁর পত্নীতলা উপজেলার বুজরুক মামুদপুর গ্রামে। সংসার ও কর্মজীবনের পাশাপাশি সাহিত্যচর্চাকে তিনি নিয়েছেন জীবনের অনুষঙ্গ হিসেবে। মানবিক মূল্যবোধ ও নারীর সংগ্রাম তাঁর লেখার প্রধান উপজীব্য।<br><br><b>পেশাগত জীবন:</b> দীর্ঘদিন বিভিন্ন প্রতিষ্ঠানে কর্মরত ছিলেন। আবুল খায়ের টোব্যাকো, মডার্ন কসমেটিকস অ্যান্ড হারবাল ইন্ডাস্ট্রিজ লিমিটেড এবং রানি কেমিক্যাল ওয়ার্কসে পিপিও ও এসপিও পদে দক্ষতার সঙ্গে দায়িত্ব পালন করেছেন।<br><br><b>সাহিত্যকর্ম:</b> লেখালেখির জগতে তাঁর পথচলা কবিতা দিয়ে। তাঁর কবিতায় জীবনের গভীর বোধ ও সহজ-সরল প্রকাশভঙ্গি একইসাথে ধরা পড়ে। তিনি বিশ্বাস করেন, জীবনের প্রতিটি পংক্তিতেই লুকিয়ে থাকে গল্প, আর প্রতিটি গল্পই একেকটি জীবন।<br><br><b>প্রকাশিত গ্রন্থসমূহ:</b><br>১. পংক্তিতে জীবন খুঁজি - একক কাব্যগ্রন্থ, মানবাধিকার প্রকাশন<br>২. কাঠ গোলাপের গান - যৌথ<br>৩. রশ্মিজাল - যৌথ<br>৪. হৃদ অতলে তুমি - যৌথ<br><br><b>শিক্ষা:</b> বাংলাদেশ উন্মুক্ত বিশ্ববিদ্যালয় (BOU) থেকে ২০২১ সালে বিজ্ঞান বিভাগে এসএসসি, পত্নীতলা দ্বিমুখী মাধ্যমিক বিদ্যালয়, নওগাঁ। ২০২৩ সালে মানবিক বিভাগে এইচএসসি, জাহাঙ্গীরপুর টি.বি.এম কলেজ, নওগাঁ।<br><br><b>বর্তমান:</b> লেখালেখির পাশাপাশি সামাজিক ও সাংস্কৃতিক কর্মকাণ্ডে সক্রিয়।'

  var dcNames = Object.keys(dcCounts).sort(function (a, b) { return a.localeCompare(b, "bn"); });

  if (dcNames.length === 0) {
    dcEmptyMsg.textContent = "এখনো কোনো লেখকের তথ্য পাওয়া যায়নি।";
    dcEmptyMsg.style.display = "block";
  } else {
    dcNames.forEach(function (name) {
      var card = document.createElement("a");
      card.href = "/author/?name=" + encodeURIComponent(name);
      card.className = "author-card";
      card.innerHTML =
        dcAvatarHTML(name, 48) +
        '<div class="author-info">' +
          '<span class="author-name">' + name + '</span>' +
          '<span class="author-count">' + dcCounts[name] + ' টি পোস্ট</span>' +
        '</div>';
      dcGrid.appendChild(card);
    });
  }
} else {
  dcTitle.textContent = dcAuthorName;
  dcGrid.style.display = "none";

  var dcInfo = authorData[dcAuthorName];
  dcProfile.style.display = "flex";
  dcProfile.innerHTML =
    dcAvatarHTML(dcAuthorName, 110) +
    '<div class="author-profile-text">' +
      (dcInfo && dcInfo.bio ? '<p class="author-bio">' + dcInfo.bio + '</p>' : '<p class="author-bio" style="color:#999;">এই লেখকের সম্পর্কে এখনো বিস্তারিত তথ্য যুক্ত করা হয়নি।</p>') +
    '</div>';

  var dcTarget = dcNormalize(dcAuthorName);
  var dcFiltered = dcAllPosts.filter(function (p) { return dcNormalize(p.author) === dcTarget; });

  if (dcFiltered.length === 0) {
    dcEmptyMsg.textContent = "এই লেখকের কোনো পোস্ট পাওয়া যায়নি।";
    dcEmptyMsg.style.display = "block";
  } else {
    dcFiltered.forEach(function (post) {
      var div = document.createElement("div");
      div.className = "post-item";
      div.innerHTML =
        '<a href="' + post.url + '">' +
          (post.image ? '<img src="' + post.image + '" alt="' + post.title + '" class="post-thumb">' : '') +
        '</a>' +
        '<h2><a href="' + post.url + '">' + post.title + '</a></h2>' +
        '<span class="post-date">' + post.date + '</span>' +
        '<p>' + post.excerpt + '</p>' +
        '<a href="' + post.url + '" class="read-more-btn">আরও পড়ুন →</a>';
      dcContainer.appendChild(div);
    });
  }
}
</script>
