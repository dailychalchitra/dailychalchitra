name: Generate share images

on:
  push:
    branches: [main]
    paths:
      - '_posts/**'
      - 'assets/img/**'
      - 'scripts/generate-og.js'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  og:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install
        run: npm install

      - name: Generate images
        run: node scripts/generate-og.js

      - name: Commit images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/og
          git diff --cached --quiet || (git commit -m "Update share images [skip ci]" && git push)
