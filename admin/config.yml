backend:
  name: github
  repo: dailychalchitra/dailychalchitra
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth
publish_mode: editorial_workflow
media_folder: "assets/img"
public_folder: "/assets/img"
collections:
    - name: "authors"
    label: "লেখক তালিকা"
    folder: "_authors"
    create: true
    slug: "{{slug}}"
    fields:
            - {label: "লেখকের নাম", name: "title", widget: "string"}
            - {label: "পরিচিতি", name: "bio", widget: "text", required: false}
            - {label: "ছবি", name: "image", widget: "image", required: false}
    - name: "blog"
    label: "নিউজ পোস্ট"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "{{slug}}"
    fields:
            - {label: "Layout", name: "layout", widget: "hidden", default: "post"}
            - label: "শিরোনাম"
        name: "title"
        widget: "string"
            - label: "তারিখ ও সময়"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD HH:mm:ss ZZ"
        date_format: "DD/MM/YYYY"
        time_format: "hh:mm A"
        picker_utc: false
            - label: "ফিচার ছবি"
        name: "image"
        widget: "image"
        media_folder: "/assets/img"
        public_folder: "/assets/img"
        required: false
            - label: "লেখক"
        name: "author"
        widget: "relation"
        collection: "authors"
        value_field: "title"
        display_fields: ["title"]
        search_fields: ["title"]
        required: false
            - label: "মূল ক্যাটাগরি"
        name: "categories"
        widget: "select"
        multiple: true
        options:
                    - "বাংলাদেশ"
                    - "বিশ্ব"
                    - "সংবাদ"
                    - "সাহিত্য বিভাগ"
                    - "কবিতা"
                    - "গল্প"
                    - "উপন্যাস"
                    - "প্রবন্ধ ও নিবন্ধ"
                    - "রম্যরচনা"
                    - "কৌতুক"
                    - "ভ্রমণ"
                    - "বই পরিচিতি"
                    - "উক্তি"
                    - "চিঠি"
                    - "লেখক তালিকা"
                    - "বিনোদন"
                    - "শিক্ষা"
                    - "খেলাধুলা"
                    - "জীবনযাপন"
                    - "চাকরির বিজ্ঞপ্তি"
                    - "বাণিজ্য"
                    - "ধর্ম বিষয়ক"
                    - "বিভাগ সমূহ"
