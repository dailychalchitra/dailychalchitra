backend:
  name: github
  repo: dailychalchitra/dailychalchitra
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

publish_mode: editorial_workflow

media_folder: "assets/img"
public_folder: "/assets/img"

collections:

    - name: "authors"
    label: "লেখক তালিকা"
    folder: "_authors"
    create: true
    slug: "{{slug}}"
    fields:
            - {label: "লেখকের নাম", name: "title", widget: "string"}
            - {label: "পরিচিতি", name: "bio", widget: "text", required: false}
            - {label: "ছবি", name: "image", widget: "image", required: false}

    - name: "blog"
    label: "নিউজ পোস্ট"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    preview_path: "{{slug}}"
    fields:
            - {label: "Layout", name: "layout", widget: "hidden", default: "post"}

            - label: "শিরোনাম"
        name: "title"
        widget: "string"

            - label: "তারিখ ও সময়"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD HH:mm:ss ZZ"
        date_format: "DD/MM/YYYY"
        time_format: "hh:mm A"
        picker_utc: false

            - label: "ফিচার ছবি"
        name: "image"
        widget: "image"
        media_folder: "/assets/img"
        public_folder: "/assets/img"
        required: false

            - label: "লেখক"
        name: "author"
        widget: "relation"
        collection: "authors"
        value_field: "title"
        display_fields: ["title"]
        search_fields: ["title"]

            - label: "মূল ক্যাটাগরি"
        name: "categories"
        widget: "select"
        multiple: true
        options:
                    - "বাংলাদেশ"
                    - "বিশ্ব"
                    - "সংবাদ"
                    - "সাহিত্য বিভাগ"
                    - "বিনোদন"
                    - "শিক্ষা"
                    - "খেলাধুলা"
                    - "প্রযুক্তি"
                    - "মতামত"
                    - "প্রবাস"
                    - "ধর্ম বিষয়ক"
                    - "বাণিজ্য"
                    - "জীবনযাপন"
                    - "অন্যান্য"
                    - "কবিতা"
                    - "পদ্য কবিতা"
                    - "গদ্য কবিতা"
                    - "ছড়া কবিতা"
                    - "দ্রোহী কবিতা"
                    - "অনু কবিতা"
                    - "সনেট কবিতা"
                    - "গল্প"
                    - "ছোট গল্প"
                    - "বড় গল্প"
                    - "উপন্যাস"
                    - "প্রবন্ধ ও নিবন্ধ"
                    - "ভ্রমণ"
                    - "কৌতুক"
                    - "রম্যরচনা"

            - label: "সাব ক্যাটাগরি / ট্যাগ"
        name: "tags"
        widget: "select"
        multiple: true
        allow_add: true
        create: true
        options:
                    - "সর্বশেষ"
                    - "সাহিত্য"
                    - "কবিতা"
                    - "গল্প"
                    - "সংবাদ"
                    - "বাংলাদেশ"
                    - "বিশ্ব"
                    - "খেলাধুলা"
                    - "বিনোদন"
                    - "প্রযুক্তি"
                    - "শিক্ষা"
                    - "মতামত"
                    - "প্রবাস"

            - label: "বিস্তারিত লেখা"
        name: "body"
        widget: "markdown"
