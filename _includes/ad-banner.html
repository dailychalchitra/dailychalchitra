<section class="dc-ad-wrap" aria-label="বিজ্ঞাপন">
  <a class="dc-ad-card" id="dcAdCard" href="/contact.html">
    <img id="dcAdImg" src="/assets/img/ad-1.webp" alt="দৈনিক চালচিত্র বিজ্ঞাপন">
    <div class="dc-ad-text">
      <span class="dc-ad-kicker" id="dcAdKicker">আপনার বিজ্ঞাপন</span>
      <span class="dc-ad-title" id="dcAdTitle">দৈনিক চালচিত্র</span>
      <span class="dc-ad-sub" id="dcAdSub">সবসময় সত্য প্রকাশে অটল</span>
    </div>
  </a>
</section>

<script>
(function () {
  var ads = [
    { img: '/assets/img/ad-1.webp', kicker: 'আপনার বিজ্ঞাপন', title: 'দৈনিক চালচিত্র', sub: 'সবসময় সত্য প্রকাশে অটল' },
    { img: '/assets/img/ad-2.webp', kicker: 'সাহিত্য ও সংবাদ', title: 'আপনার পছন্দের লেখাটি পাঠান', sub: 'প্রচার মাধ্যম' },
    { img: '/assets/img/ad-3.webp', kicker: 'বিজ্ঞাপন', title: 'আপনার ব্যবসার বিজ্ঞাপন পাঠান', sub: 'যোগাযোগ করুন →' }
  ];
  var img = document.getElementById('dcAdImg');
  var kicker = document.getElementById('dcAdKicker');
  var title = document.getElementById('dcAdTitle');
  var sub = document.getElementById('dcAdSub');
  if (!img) return;
  var i = 0;
  setInterval(function () {
    i = (i + 1) % ads.length;
    img.src = ads[i].img;
    kicker.textContent = ads[i].kicker;
    title.textContent = ads[i].title;
    sub.textContent = ads[i].sub;
  }, 1000);
})();
</script>

<style>
.dc-ad-wrap{width:100%;margin:16px 0;padding:0 5%;box-sizing:border-box;display:flex;justify-content:center}
.dc-ad-card{position:relative;display:block;width:100%;max-width:900px;height:160px;border-radius:4px;
  overflow:hidden;background:#f2f2f2}
.dc-ad-card img{width:100%;height:100%;object-fit:contain;display:block}
.dc-ad-text{position:absolute;left:0;right:0;bottom:0;padding:10px 16px;
  background:linear-gradient(0deg,rgba(0,0,0,.6),rgba(0,0,0,0));color:#fff;
  font-family:'Hind Siliguri','Noto Sans Bengali',sans-serif;pointer-events:none}
.dc-ad-kicker{display:inline-block;background:#C00000;color:#fff;font-size:12px;font-weight:600;
  padding:2px 10px;border-radius:3px;margin-bottom:4px}
.dc-ad-title{display:block;font-size:22px;font-weight:700;line-height:1.3;color:#fff;
  text-shadow:0 1px 3px rgba(0,0,0,.6)}
.dc-ad-sub{display:block;font-size:14px;font-weight:500;color:#ffd23f;margin-top:2px;
  text-shadow:0 1px 2px rgba(0,0,0,.6)}
@media (max-width:640px){
  .dc-ad-card{height:160px}
  .dc-ad-title{font-size:17px}
  .dc-ad-sub{font-size:12px}
  .dc-ad-kicker{font-size:11px}
}
</style>
