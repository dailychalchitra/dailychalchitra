<!DOCTYPE html>
<html>
<head>
  <title>Daily Chalchitra - FCM Token</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: sans-serif;
      padding: 20px;
      line-height: 1.6;
    }

    h2 {
      margin-bottom: 10px;
    }

    #status {
      padding: 10px;
      background: #f1f1f1;
      border-radius: 8px;
    }

    #token {
      margin-top: 15px;
      padding: 15px;
      background: #eeeeee;
      border-radius: 8px;
      word-break: break-all;
    }
  </style>
</head>

<body>

<h2>🔔 Daily Chalchitra Notification</h2>

<p id="status">অনুমতি চাওয়া হচ্ছে...</p>

<pre id="token"></pre>


<script type="module">

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import { getMessaging, getToken } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";

import { getDatabase, ref, set } 
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


const firebaseConfig = {

  apiKey: "AIzaSyAiIKd1wdKTNAp0w1qTZlIM0FeSGg0t0b4",

  authDomain: "daily-chalchitra-60994.firebaseapp.com",

  databaseURL: 
  "https://daily-chalchitra-60994-default-rtdb.firebaseio.com",

  projectId: "daily-chalchitra-60994",

  storageBucket: 
  "daily-chalchitra-60994.firebasestorage.app",

  messagingSenderId: "792541060086",

  appId: 
  "1:792541060086:web:078fe75f16940c5d0005d7"
};


const app = initializeApp(firebaseConfig);

const messaging = getMessaging(app);

const db = getDatabase(app);


const vapidKey = 
"BMXn4w-VGgzRAGZaKrqIxBeX0S6ap0zTCWBmQ2N_tqO6rmjZ8QYqgnnZIcX4SatmebwrOBsTnyk54zpX0u4Ycgo";



async function startFCM() {

try {


const permission = await Notification.requestPermission();


if(permission !== "granted") {

document.getElementById("status").innerText =
"❌ Notification অনুমতি দেওয়া হয়নি।";

return;

}



document.getElementById("status").innerText =
"✅ অনুমতি পাওয়া গেছে। Token তৈরি হচ্ছে...";



const registration = await navigator.serviceWorker.register(
"/firebase-messaging-sw.js"
);



const currentToken = await getToken(
messaging,
{
vapidKey: vapidKey,
serviceWorkerRegistration: registration
}
);



if(currentToken) {


document.getElementById("status").innerText =
"✅ Token তৈরি হয়েছে এবং Database-এ সংরক্ষণ করা হচ্ছে";


document.getElementById("token").innerText =
currentToken;



await set(

ref(
db,
"fcm_tokens/admin"
),

currentToken

);



document.getElementById("status").innerText =
"✅ Notification Active হয়েছে";


}

else {


document.getElementById("status").innerText =
"❌ Token পাওয়া যায়নি";

}


}

catch(error) {


document.getElementById("status").innerText =
"Error: " + error.message;


console.error(error);


}

}


startFCM();


</script>

</body>
</html>
