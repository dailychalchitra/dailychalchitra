---
layout: default
title: "ই-পেপার | দৈনিক চলচিত্র"
permalink: /epaper/
---

<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes"
  >

  <meta
    name="description"
    content="দৈনিক চলচিত্র ই-পেপার — প্রতিদিনের মুদ্রিত পত্রিকার সম্পূর্ণ অনলাইন সংস্করণ।"
  >

  <meta name="theme-color" content="#111111">

  <title>দৈনিক চলচিত্র — ই-পেপার</title>

  <!-- E-paper main stylesheet -->
  <link
    rel="stylesheet"
    href="{{ '/assets/epaper/css/epaper.css' | relative_url }}"
  >
</head>

<body class="epaper-page">

  <!-- =========================================================
       E-PAPER APPLICATION
       ========================================================= -->

  <main id="epaperApp" class="epaper-app">

    <!-- =======================================================
         TOP BAR
         ======================================================= -->

    <header class="epaper-topbar">

      <div class="epaper-topbar-inner">

        <!-- Brand -->
        <a
          href="{{ '/' | relative_url }}"
          class="epaper-brand"
          aria-label="দৈনিক চলচিত্র মূল সাইটে ফিরে যান"
        >
          <span class="epaper-brand-name">দৈনিক চলচিত্র</span>
          <span class="epaper-brand-subtitle">ই-পেপার</span>
        </a>

        <!-- Edition selector -->
        <div class="epaper-edition-wrapper">

          <label
            for="editionSelector"
            class="visually-hidden"
          >
            সংস্করণ নির্বাচন করুন
          </label>

          <select
            id="editionSelector"
            class="epaper-edition-selector"
            aria-label="সংস্করণ নির্বাচন"
          >
            <option value="main">প্রথম সংস্করণ</option>
            <option value="second">দ্বিতীয় সংস্করণ</option>
            <option value="regional">আঞ্চলিক সংস্করণ</option>
          </select>

        </div>

        <!-- Date -->
        <div class="epaper-date-wrapper">

          <label
            for="issueDate"
            class="visually-hidden"
          >
            তারিখ নির্বাচন করুন
          </label>

          <input
            type="date"
            id="issueDate"
            class="epaper-date-picker"
            aria-label="ই-পেপারের তারিখ নির্বাচন"
          >

        </div>

      </div>

    </header>


    <!-- =======================================================
         MAIN CONTENT
         ======================================================= -->

    <section class="epaper-main">

      <!-- =====================================================
           ISSUE HEADER
           ===================================================== -->

      <div class="epaper-issue-header">

        <div class="epaper-issue-title-area">

          <h1 id="issueTitle">
            আজকের পত্রিকা
          </h1>

          <p id="issueDateLabel">
            ই-পেপার
          </p>

        </div>

        <div class="epaper-issue-actions">

          <button
            type="button"
            id="openViewerButton"
            class="epaper-action-button epaper-primary-button"
          >
            <span aria-hidden="true">▣</span>
            পত্রিকা দেখুন
          </button>

        </div>

      </div>


      <!-- =====================================================
           PAGE LIST
           ===================================================== -->

      <section
        class="epaper-pages-section"
        aria-labelledby="pagesHeading"
      >

        <div class="epaper-section-header">

          <h2 id="pagesHeading">
            সকল পাতা
          </h2>

          <span
            id="pageCount"
            class="epaper-page-count"
          >
            ০ পাতা
          </span>

        </div>


        <!-- Dynamic page grid -->
        <div
          id="pageGrid"
          class="epaper-page-grid"
          aria-live="polite"
        >

          <!--
            JavaScript এখানে newspaper pages তৈরি করবে।
          -->

          <div
            class="epaper-loading"
            id="pageLoading"
          >
            <div class="epaper-loading-spinner"></div>
            <p>ই-পেপার লোড হচ্ছে...</p>
          </div>

        </div>

      </section>


      <!-- =====================================================
           FEATURE / SUPPLEMENT SECTION
           ===================================================== -->

      <section
        class="epaper-feature-section"
        aria-labelledby="featureHeading"
      >

        <div class="epaper-section-header">

          <h2 id="featureHeading">
            ফিচার পাতা
          </h2>

        </div>

        <div
          id="featureGrid"
          class="epaper-feature-grid"
        >

          <!-- Dynamic feature pages -->

        </div>

      </section>

    </section>

  </main>


  <!-- =========================================================
       FULLSCREEN E-PAPER VIEWER
       ========================================================= -->

  <div
    id="epaperViewer"
    class="epaper-viewer"
    aria-hidden="true"
  >

    <!-- Viewer top bar -->
    <header class="viewer-topbar">

      <div class="viewer-topbar-left">

        <button
          type="button"
          id="viewerCloseButton"
          class="viewer-icon-button"
          aria-label="Viewer বন্ধ করুন"
          title="বন্ধ করুন"
        >
          ×
        </button>

        <strong
          id="viewerTitle"
          class="viewer-title"
        >
          ই-পেপার
        </strong>

      </div>


      <div class="viewer-topbar-center">

        <button
          type="button"
          id="viewerPreviousButton"
          class="viewer-control-button"
          aria-label="আগের পাতা"
          title="আগের পাতা"
        >
          ‹
        </button>

        <span class="viewer-page-position">

          <input
            type="number"
            id="viewerPageInput"
            min="1"
            value="1"
            aria-label="পৃষ্ঠা নম্বর"
          >

          <span>/</span>

          <span id="viewerTotalPages">
            0
          </span>

        </span>

        <button
          type="button"
          id="viewerNextButton"
          class="viewer-control-button"
          aria-label="পরের পাতা"
          title="পরের পাতা"
        >
          ›
        </button>

      </div>


      <div class="viewer-topbar-right">

        <button
          type="button"
          id="viewerZoomOut"
          class="viewer-icon-button"
          aria-label="Zoom out"
          title="ছোট করুন"
        >
          −
        </button>

        <span
          id="viewerZoomValue"
          class="viewer-zoom-value"
        >
          100%
        </span>

        <button
          type="button"
          id="viewerZoomIn"
          class="viewer-icon-button"
          aria-label="Zoom in"
          title="বড় করুন"
        >
          +
        </button>

        <button
          type="button"
          id="viewerFitButton"
          class="viewer-icon-button"
          aria-label="Fit page"
          title="পাতা ফিট করুন"
        >
          ⛶
        </button>

        <button
          type="button"
          id="viewerFullscreenButton"
          class="viewer-icon-button"
          aria-label="Fullscreen"
          title="Fullscreen"
        >
          ⛶
        </button>

      </div>

    </header>


    <!-- =====================================================
         VIEWER BODY
         ===================================================== -->

    <div class="viewer-body">

      <!-- Thumbnail sidebar -->

      <aside
        id="viewerSidebar"
        class="viewer-sidebar"
        aria-label="পৃষ্ঠাগুলোর তালিকা"
      >

        <div class="viewer-sidebar-header">

          <strong>সকল পাতা</strong>

          <button
            type="button"
            id="viewerSidebarToggle"
            class="viewer-icon-button"
            aria-label="পৃষ্ঠা তালিকা বন্ধ করুন"
          >
            ‹
          </button>

        </div>

        <div
          id="viewerThumbnails"
          class="viewer-thumbnails"
        >

          <!-- Dynamic thumbnails -->

        </div>

      </aside>


      <!-- Main newspaper canvas -->

      <section
        id="viewerStage"
        class="viewer-stage"
        aria-label="ই-পেপার পৃষ্ঠা"
      >

        <div
          id="viewerCanvas"
          class="viewer-canvas"
        >

          <img
            id="viewerPageImage"
            class="viewer-page-image"
            src=""
            alt="ই-পেপার পৃষ্ঠা"
            draggable="false"
          >

        </div>


        <!-- Viewer loading -->

        <div
          id="viewerLoading"
          class="viewer-loading"
          aria-hidden="true"
        >

          <div class="viewer-loading-spinner"></div>

          <span>
            পৃষ্ঠা লোড হচ্ছে...
          </span>

        </div>


        <!-- Empty/error state -->

        <div
          id="viewerError"
          class="viewer-error"
          aria-hidden="true"
        >

          <strong>
            পৃষ্ঠাটি লোড করা যাচ্ছে না
          </strong>

          <button
            type="button"
            id="viewerRetryButton"
            class="epaper-action-button"
          >
            আবার চেষ্টা করুন
          </button>

        </div>

      </section>

    </div>


    <!-- =====================================================
         MOBILE BOTTOM CONTROL BAR
         ===================================================== -->

    <nav
      class="viewer-mobile-controls"
      aria-label="E-paper controls"
    >

      <button
        type="button"
        id="mobilePreviousButton"
        class="viewer-mobile-button"
      >
        ‹
        <span>আগের</span>
      </button>

      <button
        type="button"
        id="mobilePagesButton"
        class="viewer-mobile-button"
      >
        ☰
        <span>পাতা</span>
      </button>

      <button
        type="button"
        id="mobileFitButton"
        class="viewer-mobile-button"
      >
        ⛶
        <span>Fit</span>
      </button>

      <button
        type="button"
        id="mobileNextButton"
        class="viewer-mobile-button"
      >
        ›
        <span>পরের</span>
      </button>

    </nav>

  </div>


  <!-- =========================================================
       E-PAPER DATA
       ========================================================= -->

  <script>
    window.DAILY_CHALCHITRA_EPAPER = {
      baseUrl: "{{ '/assets/epaper/' | relative_url }}",
      dataUrl: "{{ '/assets/epaper/data/issues.json' | relative_url }}",
      defaultEdition: "main",
      defaultPage: 1
    };
  </script>


  <!-- =========================================================
       E-PAPER JAVASCRIPT
       ========================================================= -->

  <script
    src="{{ '/assets/epaper/js/epaper.js' | relative_url }}"
    defer
  ></script>

</body>
</html>
