"শামীম নিমু": "কবি ও কথাসাহিত্যিক। জন্ম ১ জানুয়ারি ১৯৮৩, গাইবান্ধা। ওমান প্রবাসী। প্রবাস জীবন, প্রেম-বিরহ ও সামাজিক অসঙ্গতি তাঁর লেখার মূল উপজীব্য। প্রকাশিত গ্রন্থ ৬টি।"
"আবু জাফর সাবু": "প্রবীণ সাংবাদিক, ছড়াকার, সাহিত্যিক, গীতিকার ও নাট্যকার। ৪২ বছরের সাংবাদিকতা জীবনে বস্তুনিষ্ঠতার জন্য পরিচিত। জন্ম ১৯৪৮, মৃত্যু ২০২১।"
"দৈনিক চালচিত্র": "২০১৯ সাল থেকে পথচলা শুরু করা জনপ্রিয় অনলাইন সংবাদ ও সাহিত্য পত্রিকা। সত্য, বস্তুনিষ্ঠতা ও মানুষের কণ্ঠস্বর তুলে ধরাই আমাদের অঙ্গীকার।"
"সুকান্ত ভট্টাচার্য": "ক্ষণজন্মা বিপ্লবী কবি। বাংলা সাহিত্যে কিশোর কবি নামে পরিচিত। জন্ম ১৯২৬, মৃত্যু ১৯৪৭। উল্লেখযোগ্য গ্রন্থ: ছাড়পত্র।"
"কাজী নজরুল ইসলাম": "বাংলাদেশের জাতীয় ও বিদ্রোহী কবি। কবি, ঔপন্যাসিক, সঙ্গীতজ্ঞ ও সাংবাদিক। প্রায় ৪০০০ গানের স্রষ্টা।"
"কায়কোবাদ": "মহাকবি, আধুনিক বাংলা সাহিত্যের প্রথম মুসলিম মহাকবি। মহাকাব্য মহাশ্মশান এর জন্য অমর। জন্ম ১৮৫৭, মৃত্যু ১৯৫১।"
"রবীন্দ্রনাথ ঠাকুর": "বিশ্বকবি, নোবেলজয়ী। কবি, ঔপন্যাসিক, নাট্যকার ও গীতিকার। গীতাঞ্জলির জন্য ১৯১৩ সালে নোবেল পান।"
"লিও তলস্তয়": "রুশ সাহিত্যের অন্যতম শ্রেষ্ঠ ঔপন্যাসিক। বিশ্ববিখ্যাত উপন্যাস: যুদ্ধ ও শান্তি, আন্না কারেনিনা।"
"জসীম উদ্দীন": "পল্লীকবি। গ্রামীণ বাংলার রূপকার। কালজয়ী গ্রন্থ: নকশী কাঁথার মাঠ, সোজন বাদিয়ার ঘাট।"
"শামসুর রাহমান": "নাগরিক কবি। আধুনিক বাংলা সাহিত্যের অন্যতম প্রধান কবি। ৬৬টি কাব্যগ্রন্থের রচয়িতা।"
"জীবনানন্দ দাশ": "রূপসী বাংলার কবি ও নির্জনতম কবি। আধুনিক বাংলা কবিতার পথিকৃৎ।"
"শরৎচন্দ্র চট্টোপাধ্যায়": "অপরাজেয় কথাশিল্পী। বাংলা সাহিত্যের অন্যতম জনপ্রিয় ঔপন্যাসিক। উল্লেখযোগ্য: দেবদাস, শ্রীকান্ত।"
"বঙ্কিমচন্দ্র চট্টোপাধ্যায়": "সাহিত্য সম্রাট, বাংলা উপন্যাসের জনক। বন্দে মাতরম্ গানের রচয়িতা।"
"হুমায়ূন আহমেদ": "জনপ্রিয় কথাসাহিত্যিক, নাট্যকার ও চলচ্চিত্রকার। হিমু ও মিসির আলি চরিত্রের স্রষ্টা।"
"নির্মলেন্দু গুণ": "জনপ্রিয় আধুনিক কবি। প্রতিবাদী ও প্রেমের কবিতার জন্য পরিচিত। একুশে ও স্বাধীনতা পুরস্কারপ্রাপ্ত।"
"চণ্ডীদাস": "মধ্যযুগের প্রখ্যাত বৈষ্ণব পদকর্তা। মানবতাবাদী বাণী 'সবার উপরে মানুষ সত্য' এর স্রষ্টা।"
"মাইকেল মধুসূদন দত্ত": "মহাকবি, আধুনিক বাংলা সাহিত্যের প্রবর্তক। অমিত্রাক্ষর ছন্দ ও সনেটের প্রবর্তক। মহাকাব্য: মেঘনাদবধ।"
"ফজল-এ খোদা": "কবি, কালজয়ী গীতিকার, শিশুসংগঠক ও বীর মুক্তিযোদ্ধা। বিখ্যাত গান: সালাম সালাম হাজার সালাম।"
"ঈশ্বরচন্দ্র গুপ্ত": "যুগসন্ধিক্ষণের কবি ও সাংবাদিক। সংবাদ প্রভাকর পত্রিকার সম্পাদক।"
"ফিরোজ আহমেদ": "গবেষক, লেখক ও সংবিধান সংস্কার কমিশনের সদস্য। আইনি ও সাংবিধানিক বিষয়ে গবেষক।"
"মাহমুদুল হাসান নিজামী": "কবি, গবেষক, গীতিকার ও অনুবাদক। জাতীয় কবিতা মঞ্চের প্রতিষ্ঠাতা। ৫ হাজারের অধিক কবিতা ও গানের রচয়িতা।"
"মনিরা ইসলাম": "কবি ও সাহিত্যিক। দৈনিক চালচিত্রে নিয়মিত লেখেন। প্রকাশিত গ্রন্থ ৭টি।"
"ডা. গোলাম রহমান ব্রাইট": "কবি, প্যারামেডিকেল ও ফার্মাসিস্ট। মানবতা ও জীবনবোধ তাঁর কবিতার মূল উপজীব্য।"
"মারিয়া নূর": "কবি ও লেখক। মানবিক মূল্যবোধ ও নারীর সংগ্রাম তাঁর লেখার প্রধান উপজীব্য।"
"এম. এল. আর. বিপ্লব": "কবি ও সাহিত্যিক। দৈনিক চালচিত্রে নিয়মিত লেখেন।"
"শামীমা দিশা": "কবি ও সাহিত্যিক। দৈনিক চালচিত্রে নিয়মিত গল্প-কবিতা লেখেন।"
"Adv. রাজিয়া আক্তার পপি": "কবি ও সাহিত্যিক। দৈনিক চালচিত্রে নিয়মিত লেখেন।"
"ফাহমিদা রিয়া": "কবি ও সাহিত্যিক। দৈনিক চালচিত্রে নিয়মিত লেখেন।"
"অর্জুন চন্দ্র বিশ্বাস": "কবি ও সাহিত্যিক। দৈনিক চালচিত্রে নিয়মিত লেখেন।"
"আফরিন শিফা": "কবি ও সাহিত্যিক। দৈনিক চালচিত্রে নিয়মিত লেখেন।"
"গোলাম কবির": "কবি, সাহিত্যিক ও ব্যবসায়ী। জন্ম ১৯৬৫। প্রকাশিত কাব্যগ্রন্থ ৫টি।"
"রীতি চাকমা": "উদীয়মান লেখক। পাহাড়ের প্রকৃতি ও আদিবাসী সংস্কৃতি তাঁর লেখার অনুপ্রেরণা।"
"শ্রী বিপ্লব জলদাস": "শিল্পী, সংস্কৃতিকর্মী, সংগঠক ও সাংবাদিক। বিনয়বাঁশী শিল্পীগোষ্ঠীর প্রতিষ্ঠাতা।"
"Mariana Kiss": "রোমানিয়ার বিশিষ্ট লেখক ও সাংস্কৃতিক ব্যক্তিত্ব। Revista Ecourile Inimii পত্রিকার প্রতিষ্ঠাতা।"
"Bogdana Gageanu": "রোমানিয়ার বিশিষ্ট কবি, লেখক ও নাট্যকার। আন্তর্জাতিক সাহিত্যে পুরস্কারপ্রাপ্ত।"
"Cristina Serghiescu": "রোমানিয়ার সমসাময়িক কবি, লেখক ও প্রাথমিক বিদ্যালয়ের শিক্ষক।"
"Lenuta Bobotan": "রোমানিয়ার কবি ও সাহিত্যিক। বর্তমানে যুক্তরাজ্যের লন্ডন প্রবাসী।"
"Adrian Bexa": "রোমানিয়ার কবি ও সাহিত্যিক। Orastie, রোমানিয়ায় বসবাসরত।"
"লুতফার রহমান": "ভারতীয় লেখক ও সাহিত্যিক। জীবনের বাস্তবতা ও মানবিক মূল্যবোধ তাঁর লেখার বিষয়।"
"ডেস্ক রিপোর্ট": "দৈনিক চালচিত্রের প্রধান সংবাদ বিভাগ। বস্তুনিষ্ঠ ও যাচাইকৃত সংবাদ দ্রুত পৌঁছে দেওয়াই আমাদের কাজ।"
"স্পোর্টস ডেস্ক": "দৈনিক চালচিত্রের ক্রীড়া বিষয়ক বিশেষ বিভাগ। দেশ-বিদেশের খেলাধুলার সর্বশেষ খবর নিয়ে আয়োজন।"
"মোঃ রহমত আলী": "খুলনার বাসিন্দা। দৈনিক চালচিত্রে নিয়মিত লেখেন।"
"মাইন উদ্দিন": "সোশ্যাল মিডিয়া লেখক। দৈনিক চালচিত্র সহ একাধিক ওয়েবসাইটে নিয়মিত লেখেন।"
"চট্টগ্রাম প্রতিনিধি": "দৈনিক চালচিত্রের চট্টগ্রাম ভিত্তিক সংবাদ বিভাগ। চট্টগ্রাম অঞ্চলের সংবাদ প্রকাশ করে।"
"খালিদ মামুন": "কবি ও সাহিত্যিক। ইসলামী জ্ঞান ও আত্মিক উন্নতির প্রতি আকর্ষণ থেকে সাহিত্যচর্চা করেন।"
"বাঁধন মৈত্র": "উদীয়মান তরুণ গল্পকার ও প্রাবন্ধিক। ঢাকা সেন্ট্রাল ইউনিভার্সিটির শিক্ষার্থী।"
"মো. ফায়েকুজ্জামান মিয়া": "সহযোগী অধ্যাপক, গোপালগঞ্জ বিজ্ঞান ও প্রযুক্তি বিশ্ববিদ্যালয়। শিক্ষা ও মানবিক বিষয়ে লেখেন।"
