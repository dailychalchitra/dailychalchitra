"শামীম নিমু":
  img: "/assets/img/shamim-nimu-profile.webp"
  bio: "কবি ও কথাসাহিত্যিক। ওমান প্রবাসী এই কবি প্রবাস জীবনের একাকীত্ব, দেশপ্রেম ও প্রেম-বিরহ তাঁর লেখার মূল উপজীব্য। প্রকাশিত গ্রন্থ ৬টি।"

"দৈনিক চালচিত্র":
  img: "/assets/img/daily-chalchitra-profile.webp"
  bio: "২০১৯ সাল থেকে পথচলা শুরু করা একটি জনপ্রিয় অনলাইন সংবাদ ও সাহিত্য পত্রিকা। সত্য, বস্তুনিষ্ঠতা ও মানুষের কণ্ঠস্বরকে তুলে ধরাই আমাদের অঙ্গীকার।"

"ডেস্ক রিপোর্ট":
  img: "/assets/img/desk-report-profile.webp"
  bio: "দৈনিক চালচিত্রের প্রধান সংবাদ বিভাগ। দেশ-বিদেশের সর্বশেষ, বস্তুনিষ্ঠ ও যাচাইকৃত সংবাদ দ্রুত পাঠকের কাছে পৌঁছে দেওয়াই আমাদের কাজ।"

"স্পোর্টস ডেস্ক":
  img: "/assets/img/sports-desk-profile.webp"
  bio: "দৈনিক চালচিত্রের ক্রীড়া বিষয়ক বিশেষ বিভাগ। দেশ-বিদেশের খেলাধুলার সর্বশেষ খবর, লাইভ স্কোর ও বিশ্লেষণ নিয়ে আমাদের আয়োজন।"

"খালিদ মামুন":
  img: "/assets/img/khalid-mamun-profile.webp"
  bio: "কবি ও সাহিত্যিক। ইসলামী জ্ঞান ও আত্মিক উন্নতির প্রতি গভীর আকর্ষণ থেকে সাহিত্যচর্চা করেন।"
  
