---
layout: default
permalink: /404.html
sitemap: false
---

<div class="dc-tag-archive" id="dc-tag-wrap" style="display:none;">
  <h1 class="archive-title" id="dc-tag-title">ট্যাগ</h1>
  <div class="post-list" id="dc-tag-posts"></div>
  <p id="dc-tag-empty" style="display:none; color:#777; text-align:center; margin-top:30px;">এই ট্যাগে এখনো কোনো পোস্ট নেই।</p>
</div>

<div id="dc-404-wrap" style="text-align:center;padding:60px 20px;">
  <h1 style="font-size:60px;margin:0;color:#C00000;">৪০৪</h1>
  <p style="font-size:18px;color:#555;">দুঃখিত, এই পেজটি খুঁজে পাওয়া যায়নি।</p>
  <a href="/" style="display:inline-block;margin-top:20px;background:#C00000;color:#fff;padding:10px 24px;border-radius:5px;text-decoration:none;">হোমে ফিরে যান</a>
</div>

<script>
var dcTagSlugs = {{ site.data.tag_slugs | jsonify }};
var dcPath = window.location.pathname;
var dcMatch = dcPath.match(/^\/tag\/([^\/]+)\/?$/);
var dcTagName = dcSlug ? dcTagSlugs[dcSlug] : null;
var dcTagNames = dcTagName ? dcTagName.split(',').map(function (s) { return s.trim(); }) : [];

if (dcTagNames.length) {
  document.getElementById('dc-404-wrap').style.display = 'none';
  document.getElementById('dc-tag-wrap').style.display = 'block';
  document.getElementById('dc-tag-title').textContent = dcTagNames.join(' ও ');
  var dcAllPosts = [
    {% for post in site.posts %}
    {
      "title": {{ post.title | jsonify }},
      "url": {{ post.url | relative_url | jsonify }},
      "date": {{ post.date | date: "%d %B %Y" | jsonify }},
      "author": {{ post.author | default: "" | jsonify }},
      "image": {% if post.image %}{{ post.image | relative_url | jsonify }}{% else %}null{% endif %},
      "excerpt": {{ post.content | strip_html | truncatewords: 25 | jsonify }},
      "tags": {{ post.tags | jsonify }},
      "categories": {{ post.categories | jsonify }}
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ];

  function dcNormalize(s) {
    return (s || "").toString().normalize("NFC").replace(/[\s\-]+/g, "").toLowerCase();
  }

    var dcNormTargets = dcTagNames.map(dcNormalize);
  var dcFiltered = dcAllPosts.filter(function (p) {
    var dcAllTerms = (p.tags || []).concat(p.categories || []);
    var dcNormTerms = dcAllTerms.map(dcNormalize);
    return dcNormTargets.some(function (t) { return dcNormTerms.indexOf(t) !== -1; });
  });

  var dcContainer = document.getElementById("dc-tag-posts");
  var dcEmptyMsg = document.getElementById("dc-tag-empty");

  if (dcFiltered.length === 0) {
    dcEmptyMsg.style.display = "block";
  } else {
    dcFiltered.forEach(function (post) {
      var div = document.createElement("div");
      div.className = "post-item";
      div.innerHTML =
        '<a href="' + post.url + '">' +
          (post.image ? '<img src="' + post.image + '" alt="' + post.title + '" class="post-thumb">' : '') +
        '</a>' +
        '<h2><a href="' + post.url + '">' + post.title + '</a></h2>' +
        '<span class="post-date">' + post.date + ' • ' + post.author + '</span>' +
        '<p>' + post.excerpt + '</p>' +
        '<a href="' + post.url + '" class="read-more-btn">আরও পড়ুন →</a>';
      dcContainer.appendChild(div);
    });
  }
}
</script>

<style>
.dc-tag-archive { max-width: 800px; margin: 20px auto; padding: 15px; }
.archive-title { font-size: 32px; margin-bottom: 30px; border-bottom: 3px solid #d32f2f; padding-bottom: 10px; }
.post-item { margin-bottom: 40px; padding-bottom: 30px; border-bottom: 1px solid #ddd; }
.post-thumb { width: 100%; height: 200px; object-fit: cover; border-radius: 8px; margin-bottom: 15px; }
.post-item h2 { margin: 10px 0; }
.post-item h2 a { color: #111; text-decoration: none; font-size: 22px; }
.post-item h2 a:hover { color: #d32f2f; }
.post-date { color: #666; font-size: 14px; }
.post-item p { color: #333; line-height: 1.8; margin: 12px 0; }
.read-more-btn { display: inline-block; background: #d32f2f; color: #fff; padding: 10px 20px; border-radius: 5px; text-decoration: none; font-weight: bold; margin-top: 10px; }
.read-more-btn:hover { background: #b71c1c; }
</style>
