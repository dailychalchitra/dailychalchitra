<!-- ==========================================
     READER-SPECIFIC CSS
     ========================================== -->
<style>

.dc-epaper-reader{
  width:100%;
  max-width:1400px;
  margin:0 auto;
  padding:20px;
  box-sizing:border-box;
  font-family:'Noto Sans Bengali','Hind Siliguri',sans-serif;
}


/* HEADER */

.dc-reader-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  background:#fff;
  border-bottom:1px solid #e5e5e5;
  padding:12px 0 15px;
}

.dc-reader-brand{
  display:flex;
  align-items:center;
  gap:20px;
}

.dc-reader-back{
  display:inline-flex;
  align-items:center;
  gap:7px;
  color:#C00000;
  text-decoration:none;
  font-weight:700;
  white-space:nowrap;
}

.dc-reader-back:hover{
  color:#8B0000;
}

.dc-reader-title-wrap{
  border-left:1px solid #ddd;
  padding-left:20px;
}

.dc-reader-title-wrap h1{
  margin:0;
  font-family:'Noto Serif Bengali',serif;
  font-size:22px;
  font-weight:900;
  color:#111;
}

.dc-reader-title-wrap div{
  margin-top:2px;
  color:#777;
  font-size:13px;
}


.dc-reader-actions{
  display:flex;
  align-items:center;
  gap:6px;
}

.dc-reader-action{
  width:38px;
  height:38px;
  border:1px solid #ddd;
  border-radius:6px;
  background:#fff;
  color:#333;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
}

.dc-reader-action:hover{
  background:#C00000;
  color:#fff;
  border-color:#C00000;
}

.dc-reader-zoom-value{
  min-width:48px;
  text-align:center;
  font-size:13px;
  font-weight:700;
}


/* NAVIGATION */

.dc-reader-navigation{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:20px;
  padding:15px 0;
  flex-wrap:wrap;
}

.dc-reader-nav-btn{
  border:none;
  background:#C00000;
  color:#fff;
  padding:9px 16px;
  border-radius:6px;
  cursor:pointer;
  font-family:inherit;
  font-weight:700;
}

.dc-reader-nav-btn:hover{
  background:#8B0000;
}

.dc-reader-nav-btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.dc-reader-page-selector{
  display:flex;
  align-items:center;
  gap:7px;
  color:#333;
  font-size:14px;
  font-weight:600;
}

.dc-reader-page-selector select{
  min-width:100px;
  padding:8px 30px 8px 10px;
  border:1px solid #ccc;
  border-radius:6px;
  background:#fff;
  font-family:inherit;
}


/* MAIN */

.dc-reader-main{
  position:relative;
  min-height:500px;
  background:#e9e9e9;
  border:1px solid #ddd;
  border-radius:8px;
  overflow:auto;
  padding:30px;
}


/* LOADING */

.dc-reader-loading{
  min-height:450px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  color:#777;
}

.dc-reader-spinner{
  width:42px;
  height:42px;
  border:4px solid #ddd;
  border-top-color:#C00000;
  border-radius:50%;
  animation:dcReaderSpin .8s linear infinite;
  margin-bottom:15px;
}

@keyframes dcReaderSpin{
  to{
    transform:rotate(360deg);
  }
}


/* ERROR */

.dc-reader-error{
  min-height:400px;
  text-align:center;
  padding:100px 20px;
  box-sizing:border-box;
  color:#777;
}

.dc-reader-error > i{
  color:#C00000;
  font-size:45px;
  margin-bottom:15px;
}

.dc-reader-error h2{
  color:#222;
  font-family:'Noto Serif Bengali',serif;
  margin:0 0 8px;
}

.dc-reader-error p{
  margin:0 0 20px;
}

.dc-reader-retry{
  background:#C00000;
  color:#fff;
  border:none;
  border-radius:6px;
  padding:10px 20px;
  cursor:pointer;
  font-family:inherit;
  font-weight:700;
}


/* STAGE */

.dc-reader-stage{
  min-width:100%;
  display:flex;
  justify-content:center;
  align-items:flex-start;
}

.dc-reader-page-wrapper{
  transform-origin:top center;
  transition:transform .2s ease;
}

.dc-reader-page{
  width:1000px;
  min-height:1414px;
  background:#fff;
  box-shadow:0 2px 15px rgba(0,0,0,.2);
  padding:25px;
  box-sizing:border-box;
  color:#111;
}


/* PAPER HEADER */

.dc-reader-paper-header{
  border-bottom:2px solid #111;
  padding-bottom:10px;
  margin-bottom:15px;
  text-align:center;
}

.dc-reader-paper-date{
  font-size:12px;
  color:#555;
  margin-bottom:4px;
}

.dc-reader-paper-logo img{
  max-width:220px;
  max-height:80px;
  object-fit:contain;
}

.dc-reader-paper-info{
  font-size:12px;
  color:#555;
  margin-top:4px;
}


/* CONTENT */

.dc-reader-paper-content{
  width:100%;
  min-height:1200px;
}


/* BOTTOM */

.dc-reader-bottom{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:30px;
  padding:20px 0;
}

.dc-reader-bottom-btn{
  background:#C00000;
  color:#fff;
  border:none;
  border-radius:6px;
  padding:10px 18px;
  cursor:pointer;
  font-family:inherit;
  font-weight:700;
}

.dc-reader-bottom-btn:hover{
  background:#8B0000;
}

.dc-reader-bottom-btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}

.dc-reader-page-number{
  font-size:16px;
}


/* THUMBNAILS */

.dc-reader-thumbnails-section{
  border-top:1px solid #ddd;
  padding-top:20px;
  margin-top:10px;
}

.dc-reader-section-heading{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.dc-reader-section-heading h2{
  margin:0;
  font-family:'Noto Serif Bengali',serif;
  font-size:20px;
}

.dc-reader-section-heading span{
  color:#777;
  font-size:13px;
}

.dc-reader-thumbnails{
  display:grid;
  grid-template-columns:repeat(6,1fr);
  gap:12px;
}

.dc-reader-thumbnail{
  border:2px solid #ddd;
  border-radius:6px;
  background:#fff;
  padding:5px;
  cursor:pointer;
  transition:.2s;
}

.dc-reader-thumbnail:hover{
  border-color:#C00000;
  transform:translateY(-2px);
}

.dc-reader-thumbnail.active{
  border-color:#C00000;
  box-shadow:0 0 0 2px rgba(192,0,0,.15);
}

.dc-reader-thumbnail img{
  display:block;
  width:100%;
  aspect-ratio:3/4;
  object-fit:cover;
  background:#eee;
}

.dc-reader-thumbnail-number{
  display:block;
  text-align:center;
  font-size:12px;
  font-weight:700;
  padding:5px 0 2px;
  color:#333;
}


/* FULLSCREEN */

.dc-epaper-reader.dc-reader-fullscreen{
  position:fixed;
  inset:0;
  z-index:99999;
  max-width:none;
  background:#222;
  overflow:auto;
  padding:10px;
}

.dc-epaper-reader.dc-reader-fullscreen
.dc-reader-header{
  background:#222;
  color:#fff;
  border-color:#444;
}

.dc-epaper-reader.dc-reader-fullscreen
.dc-reader-title-wrap h1{
  color:#fff;
}

.dc-epaper-reader.dc-reader-fullscreen
.dc-reader-title-wrap div{
  color:#bbb;
}

.dc-epaper-reader.dc-reader-fullscreen
.dc-reader-main{
  height:calc(100vh - 130px);
  min-height:0;
}


/* MOBILE */

@media(max-width:900px){

  .dc-epaper-reader{
    padding:10px;
  }

  .dc-reader-header{
    align-items:flex-start;
  }

  .dc-reader-brand{
    gap:10px;
  }

  .dc-reader-title-wrap{
    padding-left:10px;
  }

  .dc-reader-title-wrap h1{
    font-size:18px;
  }

  .dc-reader-actions{
    gap:3px;
  }

  .dc-reader-action{
    width:34px;
    height:34px;
  }

  .dc-reader-main{
    padding:15px;
  }

  .dc-reader-page{
    width:800px;
    min-height:1131px;
  }

  .dc-reader-thumbnails{
    grid-template-columns:repeat(4,1fr);
  }

}


@media(max-width:600px){

  .dc-reader-header{
    flex-direction:column;
    align-items:stretch;
  }

  .dc-reader-brand{
    justify-content:space-between;
  }

  .dc-reader-actions{
    justify-content:center;
  }

  .dc-reader-navigation{
    gap:8px;
  }

  .dc-reader-nav-btn{
    padding:8px 10px;
    font-size:12px;
  }

  .dc-reader-main{
    padding:8px;
    min-height:400px;
  }

  .dc-reader-page{
    width:700px;
    min-height:990px;
    padding:18px;
  }

  .dc-reader-thumbnails{
    grid-template-columns:repeat(3,1fr);
  }

  .dc-reader-bottom{
    gap:10px;
  }

  .dc-reader-bottom-btn{
    padding:8px 10px;
    font-size:12px;
  }

}


/* PRINT */

@media print{

  body *{
    visibility:hidden;
  }

  .dc-epaper-reader,
  .dc-epaper-reader *{
    visibility:visible;
  }

  .dc-epaper-reader{
    position:absolute;
    left:0;
    top:0;
    width:100%;
    margin:0;
    padding:0;
  }

  .dc-reader-header,
  .dc-reader-navigation,
  .dc-reader-bottom,
  .dc-reader-thumbnails-section{
    display:none !important;
  }

  .dc-reader-main{
    background:#fff;
    border:none;
    padding:0;
    overflow:visible;
  }

  .dc-reader-page-wrapper{
    transform:none !important;
  }

  .dc-reader-page{
    width:100%;
    min-height:auto;
    box-shadow:none;
    padding:10px;
  }

  @page{
    size:A4 portrait;
    margin:.4cm;
  }

}

</style>


<!-- ==========================================
     READER BOOTSTRAP
     ========================================== -->
<script>

(function(){

  'use strict';

  function dcReaderReady(){

    /*
     * epaper-viewer.js যদি আগে থেকেই
     * এই পেজের প্রয়োজনীয় function প্রদান করে,
     * তাহলে সেটিই ব্যবহার করা হবে।
     */

    if(typeof window.DCEpaperViewer !== 'undefined'){

      if(typeof window.DCEpaperViewer.init === 'function'){
        window.DCEpaperViewer.init();
      }

    }

    /*
     * CustomEvent দিয়ে viewer-কে জানানো হচ্ছে
     * যে reader page সম্পূর্ণ প্রস্তুত।
     */

    document.dispatchEvent(
      new CustomEvent('dc-epaper-reader-ready')
    );

  }


  if(document.readyState === 'loading'){

    document.addEventListener(
      'DOMContentLoaded',
      dcReaderReady
    );

  }else{

    dcReaderReady();

  }

})();

</script>
