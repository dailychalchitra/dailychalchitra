<!-- ==========================================================
     ePaper issue page
     ========================================================== -->

<script>
(function () {

  'use strict';

  /*
   * এই পেজে epaper-core.js এবং
   * epaper-viewer.js-এর existing function ব্যবহার করা হবে।
   *
   * কোনো function না থাকলেও পেজটি ভেঙে যাবে না।
   */


  function getQueryParam(name) {

    try {

      var params =
        new URLSearchParams(
          window.location.search
        );

      return params.get(name);

    } catch (error) {

      return null;

    }

  }


  function setText(id, value) {

    var element =
      document.getElementById(id);

    if (!element) {
      return;
    }

    element.textContent =
      value || '';

  }


  function updateHeader() {

    var issue =
      getQueryParam('issue');

    var date =
      getQueryParam('date');

    var page =
      getQueryParam('page');

    if (issue) {
      setText(
        'dc-issue-label',
        issue
      );
    }

    if (date) {

      setText(
        'dc-paper-date',
        date
      );

    }

    if (issue) {

      setText(
        'dc-paper-edition',
        issue
      );

    }

    if (page) {

      setText(
        'dc-paper-page',
        'পৃষ্ঠা ' + page
      );

    }

  }


  function updatePageInfo() {

    var page =
      getQueryParam('page');

    if (page) {

      setText(
        'dc-page-info',
        'পৃষ্ঠা ' + page
      );

      setText(
        'dc-page-label',
        'পৃষ্ঠা ' + page
      );

    }

  }


  function connectButton(
    id,
    functionNames
  ) {

    var button =
      document.getElementById(id);

    if (!button) {
      return;
    }

    if (
      button.getAttribute(
        'data-dc-connected'
      ) === 'true'
    ) {
      return;
    }

    button.setAttribute(
      'data-dc-connected',
      'true'
    );

    button.addEventListener(
      'click',
      function () {

        for (
          var i = 0;
          i < functionNames.length;
          i++
        ) {

          var fn =
            window[
              functionNames[i]
            ];

          if (
            typeof fn ===
            'function'
          ) {

            try {

              fn();

              return;

            } catch (error) {

              console.error(
                'ePaper action error:',
                error
              );

            }

          }

        }

      }
    );

  }


  function initializeIssuePage() {

    updateHeader();
    updatePageInfo();


    /*
     * Previous
     */

    connectButton(
      'dc-prev-page',
      [
        'dcPreviousPage',
        'previousEpaperPage',
        'dcPrevPage'
      ]
    );


    /*
     * Next
     */

    connectButton(
      'dc-next-page',
      [
        'dcNextPage',
        'nextEpaperPage'
      ]
    );


    /*
     * First
     */

    connectButton(
      'dc-first-page',
      [
        'dcFirstPage',
        'firstEpaperPage'
      ]
    );


    /*
     * Last
     */

    connectButton(
      'dc-last-page',
      [
        'dcLastPage',
        'lastEpaperPage'
      ]
    );


    /*
     * Zoom
     */

    connectButton(
      'dc-zoom-in',
      [
        'dcZoomIn',
        'zoomInEpaper'
      ]
    );

    connectButton(
      'dc-zoom-out',
      [
        'dcZoomOut',
        'zoomOutEpaper'
      ]
    );

    connectButton(
      'dc-zoom-reset',
      [
        'dcZoomReset',
        'resetEpaperZoom'
      ]
    );


    /*
     * Print
     */

    connectButton(
      'dc-print-page',
      [
        'dcPrintPage',
        'printEpaperPage'
      ]
    );


    /*
     * All pages
     */

    var allPages =
      document.getElementById(
        'dc-all-pages'
      );

    if (allPages) {

      allPages.addEventListener(
        'click',
        function () {

          var issue =
            getQueryParam(
              'issue'
            );

          if (issue) {

            window.location.href =
              '/_epaper/epaper-home.html?issue=' +
              encodeURIComponent(issue);

          } else {

            window.location.href =
              '/_epaper/epaper-home.html';

          }

        }
      );

    }


    /*
     * Existing viewer initializer
     */

    var viewerFunctions = [
      'dcInitViewer',
      'initEpaperViewer',
      'dcEpaperViewerInit',
      'initializeEpaperViewer'
    ];

    for (
      var i = 0;
      i < viewerFunctions.length;
      i++
    ) {

      if (
        typeof window[
          viewerFunctions[i]
        ] === 'function'
      ) {

        try {

          window[
            viewerFunctions[i]
          ]();

          break;

        } catch (error) {

          console.error(
            'ePaper viewer initialization error:',
            error
          );

        }

      }

    }

  }


  /*
   * DOM Ready
   */

  if (
    document.readyState ===
    'loading'
  ) {

    document.addEventListener(
      'DOMContentLoaded',
      initializeIssuePage,
      {
        once: true
      }
    );

  } else {

    initializeIssuePage();

  }


})();
</script>
